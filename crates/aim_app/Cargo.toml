[package]
name = "aim_app"
description = "Bevy front-end for the aim trainer (rendering, input, overlay)."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "aimtrainer"
path = "src/main.rs"

[features]
default = ["match-analysis"]
# Offline post-match analysis of official match JSON (`aimtrainer analyze-match`).
match-analysis = ["dep:aim_integrations"]

[dependencies]
aim_core.workspace = true
aim_world.workspace = true
aim_integrations = { workspace = true, optional = true }
# The AI coach's providers, key storage and memory; every call runs off the frame.
aim_ai.workspace = true
serde.workspace = true
toml.workspace = true
bevy.workspace = true
bevy_egui.workspace = true
directories.workspace = true
# Local weekday for the weekly training method.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
global-hotkey.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
