id = "valorant-benchmark"
name = "VALORANT Benchmark"
description = """
Measures every aim skill VALORANT asks of you. It uses Voltaic's structure: skill → subcategory → scenarios.
Your best scenario sets each subcategory's energy, and the overall energy is the harmonic mean, so your weakest skill counts most.
PROVISIONAL: thresholds come from the simulated aimer profiles (Fitts' law model), not from real players.
Run it once a week, not daily."""
calibrated = false
ranks = ["Recruit", "Contender", "Veteran", "Elite"]
energy_per_rank = 100

[[subcategories]]
skill = "clicking"
name = "Static clicking"
scenarios = [
  { id = "micro-adjust", thresholds = [3300, 6000, 9400, 12600] },
  { id = "static-headline", thresholds = [2600, 4700, 7050, 9500] },
]

