id = "micro-adjust"
name = "Micro Adjust"
category = "microcorrection"
description = """
Static clicking. A head-sized target appears 1.5–6° from your crosshair; fix the small error and click.
Trains the finger/wrist corrections that turn near-misses into headshots."""

[targets]
shape = { kind = "sphere", radius = 0.12 }   # ≈1.4° at 10 m, close to a VALORANT head at mid range
spawn = { kind = "around_crosshair", offset_deg = [1.5, 6.0], distance = [10.0, 10.0] }

[scoring]
miss_penalty = 25
