# Spanish UI text for the "content" area. Keys are the exact English source text.
# See docs/i18n.md before editing.

# Scenarios (content/scenarios)
"Adjust Track" = "Tracking con ajustes"
"Stability tracking. A sphere drifts slowly, then suddenly darts a short way to a new spot.\nTrack it smoothly and fix each sudden offset with one small, clean correction." = "Tracking de estabilidad. Una esfera se desliza despacio y de pronto salta una distancia corta a otro punto.\nSíguela con suavidad y corrige cada salto con una sola corrección pequeña y limpia."
"Ammo Discipline" = "Disciplina de munición"
"Static clicking with an ammo economy (Voltaic S5 style): each shot costs 30 of a 100 clip and each\nhit refunds 37. Two misses in a row force a 1.5 s reload. Trains confirming the shot before you click." = "Clic estático con economía de munición (estilo Voltaic S5): cada disparo cuesta 30 de un cargador de 100 y cada acierto devuelve 37. Dos fallos seguidos fuerzan una recarga de 1.5 s. Entrena confirmar el disparo antes de hacer clic."
"Angle Flyers" = "Voladores en ángulo"
"Dynamic clicking. Five spheres wander across a wide wall and drift towards and away from you,\nchanging direction often. Click each one; a new flyer replaces it. Trains reading a moving\ntarget's path and clicking on it without chasing." = "Clic dinámico. Cinco esferas vagan por una pared ancha y se acercan y alejan de ti, cambiando de dirección a menudo. Haz clic en cada una; un nuevo volador la reemplaza. Entrena leer la trayectoria de un objetivo en movimiento y hacerle clic sin perseguirlo."
"Angle Hold Peek" = "Peek sobre ángulo"
"Hold an angle. After a random wait a small head-sized target peeks from the left or the right\nside, strafes and leaves after 1.6 s. Keep the crosshair on the head line and react fast." = "Mantén un ángulo. Tras una espera aleatoria, un objetivo pequeño del tamaño de una cabeza hace peek por la izquierda o la derecha, hace strafe y se va a los 1.6 s. Mantén el crosshair en la línea de cabeza y reacciona rápido."
"Arc Follow" = "Seguir el arco"
"Precise tracking. A small sphere is tossed in low arcs across the floor below you and\nbounces a few times before it lands. Hold fire and ride each arc smoothly through the bounces." = "Tracking preciso. Una esfera pequeña es lanzada en arcos bajos por el suelo debajo de ti y rebota varias veces antes de caer. Mantén el disparo y sigue cada arco con suavidad a través de los rebotes."
"Bobbing Heads" = "Cabezas que oscilan"
"Vertical dynamic clicking. Head-sized spheres barely drift sideways but bob up and down by more than\ntheir own height. Trains vertical timing: meet the head at the top or bottom of its bob." = "Clic dinámico vertical. Esferas del tamaño de una cabeza apenas se mueven de lado, pero suben y bajan más que su propia altura. Entrena el timing vertical: encuentra la cabeza arriba o abajo de su oscilación."
"Burst Control" = "Control de ráfagas"
"Burst control with the Vandal (recoil on: hold to fire full-auto). One head-sized target at 15–25 m takes\ntwo hits and leaves after 1.4 s. Fire short 2–3 bullet bursts, then pause about 0.4 s so the recoil fully\nresets. Each bullet of a burst climbs, so long sprays go over the head. Hits within the first 6 bullets of\na burst earn a bonus." = "Control de ráfagas con la Vandal (retroceso activado: mantén pulsado para disparo automático). Un objetivo del tamaño de una cabeza a 15–25 m necesita dos impactos y se va a los 1.4 s. Dispara ráfagas cortas de 2–3 balas y pausa unos 0.4 s para que el retroceso se reinicie por completo. Cada bala de una ráfaga sube, así que los sprays largos pasan por encima de la cabeza. Los impactos dentro de las primeras 6 balas de una ráfaga dan bonus."
"Burst Strafe" = "Burst con strafe"
"Burst with movement. Strafe, counter-strafe, fire a 2–4 bullet burst into the agent, then strafe again. It takes 3 hits.\nBullets that hit within 0.35 s of your stop earn the stop bonus, and hits among the Vandal's first 6 bullets earn the burst bonus. A long spray climbs and runs past the window; moving shots lose points." = "Burst con movimiento. Haz strafe, counter-strafe, dispara una ráfaga de 2–4 balas al agente y vuelve a hacer strafe. Necesita 3 impactos.\nLas balas que aciertan dentro de 0.35 s de tu parada ganan el bonus de parada, y los impactos entre las primeras 6 balas de la Vandal ganan el bonus de ráfaga. Un spray largo sube y se sale de la ventana; los disparos en movimiento pierden puntos."
"Close Quarters Strafe" = "Strafe a corta distancia"
"Dynamic clicking at close range. One agent at 5-9 m A/D strafes with real VALORANT rifle movement\n(5.4 m/s, measured stopping curves): close up, the head crosses your screen fast.\nTap the head on its stops and reversals; it leaves after 2.5 s." = "Clic dinámico a corta distancia. Un agente a 5-9 m hace strafe A/D con el movimiento real de rifle de VALORANT (5.4 m/s, curvas de frenado medidas): de cerca, la cabeza cruza tu pantalla rápido.\nDispara a la cabeza en sus paradas y cambios de dirección; se va a los 2.5 s."
"Cockroach Hop" = "Salto de cucaracha"
"Tiny jumpers. Very small spheres hop along the floor in short, quick bounces. Kill 15 as fast\nas you can; the final score is multiplied by the square root of your accuracy. Trains\nprecise clicks on small, erratic targets." = "Saltarines diminutos. Esferas muy pequeñas saltan por el suelo con rebotes cortos y rápidos. Elimina 15 lo más rápido que puedas; la puntuación final se multiplica por la raíz cuadrada de tu precisión. Entrena clics precisos en objetivos pequeños y erráticos."
"Counter-Strafe Duel" = "Duelo de counter-strafe"
"Movement accuracy. Strafe with A/D (VALORANT rifle movement), counter-strafe, and tap the head before the agent leaves (3 s).\nShots fired above 27.5% of run speed get running inaccuracy and lose points. Stop, then shoot." = "Precisión en movimiento. Haz strafe con A/D (movimiento de rifle de VALORANT), counter-strafe y dispara a la cabeza antes de que el agente se vaya (3 s).\nLos disparos por encima del 27.5% de la velocidad de carrera reciben imprecisión por correr y pierden puntos. Detente y luego dispara."
"Crouch Duel" = "Duelo agachado"
"Duel agents that crouch-spam and strafe while you move. Each crouch drops the head by about half a meter.\nStop, hold the head line, and tap when the head settles instead of chasing every drop. Moving shots lose points." = "Enfréntate a agentes que spamean agacharse y hacen strafe mientras te mueves. Cada agachada baja la cabeza cerca de medio metro.\nDetente, mantén la línea de cabeza y dispara cuando la cabeza se asiente en lugar de perseguir cada bajada. Los disparos en movimiento pierden puntos."
"Demo: Ballistic" = "Demo: balística"
"Engine demo for the ballistic motion. Spheres are tossed up from the floor ahead and fall\nback under gravity, bouncing once. Shoot each one before it lands for good." = "Demo del motor para el movimiento balístico. Las esferas se lanzan hacia arriba desde el suelo delante de ti y caen por la gravedad, rebotando una vez. Dispara a cada una antes de que caiga del todo."
"Demo: Polygon Bounce" = "Demo: rebote en polígono"
"Engine demo for the linear_bounce motion. A sphere glides in straight lines at a constant\nspeed and reflects off the walls of a pentagon in front of you. Keep the crosshair on it." = "Demo del motor para el movimiento linear_bounce. Una esfera se desliza en línea recta a velocidad constante y rebota en las paredes de un pentágono frente a ti. Mantén el crosshair sobre ella."
"Demo: Capsule" = "Demo: cápsula"
"Engine demo for capsule targets. Standing capsules with a small round head strafe across\nthe floor ahead. A body hit counts, but a head hit is worth more than twice as much." = "Demo del motor para objetivos cápsula. Cápsulas de pie con una pequeña cabeza redonda hacen strafe por el suelo delante de ti. Un impacto al cuerpo cuenta, pero uno a la cabeza vale más del doble."
"Demo: Depth Strafe" = "Demo: strafe en profundidad"
"Engine demo for the depth axis. Agents strafe left and right and also walk towards and\naway from you between 10 and 18 m, so their heads change size as well as position." = "Demo del motor para el eje de profundidad. Los agentes hacen strafe a izquierda y derecha y además caminan hacia ti y alejándose entre 10 y 18 m, así que sus cabezas cambian de tamaño y de posición."
"Demo: Grid" = "Demo: cuadrícula"
"Engine demo for spawn grids. Three spheres at a time sit on a 3 × 5 grid of fixed points.\nKill them in any order; each one is replaced on another grid point." = "Demo del motor para cuadrículas de aparición. Tres esferas a la vez ocupan una cuadrícula de 3 × 5 puntos fijos.\nElimínalas en cualquier orden; cada una se reemplaza en otro punto de la cuadrícula."
"Demo: Orbit" = "Demo: órbita"
"Engine demo for the orbit motion. A sphere circles around you at a fixed distance and turns\nback now and then; every four seconds a new one takes its place. Follow it all the way around." = "Demo del motor para el movimiento orbital. Una esfera gira a tu alrededor a una distancia fija y de vez en cuando da la vuelta; cada cuatro segundos otra ocupa su lugar. Síguela por toda la vuelta."
"Demo: Motion Profiles" = "Demo: perfiles de movimiento"
"Engine demo for motion profiles. The sphere switches every one to two seconds between a\nslow drift, a quick strafe and short pauses, picked by weight. Stay on it through each change." = "Demo del motor para perfiles de movimiento. La esfera cambia cada uno o dos segundos entre un deslizamiento lento, un strafe rápido y pausas cortas, elegidos por peso. Mantente sobre ella en cada cambio."
"Demo: Shrink" = "Demo: encogimiento"
"Engine demo for shrink_per_kill and accuracy_mult. Every kill makes the next sphere a\nlittle smaller, down to half its size, and the final score is multiplied by your accuracy." = "Demo del motor para shrink_per_kill y accuracy_mult. Cada baja hace la siguiente esfera un poco más pequeña, hasta la mitad de su tamaño, y la puntuación final se multiplica por tu precisión."
"Depth Brake" = "Frenado en profundidad"
"Stop going forward and back. The lane is narrow and long: walk up with W or back off with S, brake with the opposite key, and tap the head.\nThe trainer uses the same stopping curves for W/S as for A/D, so a W/S counter-strafe also takes about 0.16 s. A hit within 0.3 s of the stop earns a bonus; moving shots lose points." = "Frena yendo hacia delante y hacia atrás. El carril es estrecho y largo: avanza con W o retrocede con S, frena con la tecla contraria y dispara a la cabeza.\nEl trainer usa las mismas curvas de frenado para W/S que para A/D, así que un counter-strafe con W/S también tarda unos 0.16 s. Un acierto dentro de 0.3 s de la parada da bonus; los disparos en movimiento pierden puntos."
"Diagonal Drifters" = "Deslizadores diagonales"
"Dynamic clicking. Three medium-small spheres glide in straight lines and bounce off the walls\nof a box in front of you. The final score is multiplied by the square root of your accuracy.\nTrains timing a click on a target with a steady, readable velocity." = "Clic dinámico. Tres esferas medianas-pequeñas se deslizan en línea recta y rebotan en las paredes de una caja frente a ti. La puntuación final se multiplica por la raíz cuadrada de tu precisión.\nEntrena el timing del clic en un objetivo con una velocidad constante y fácil de leer."
"Diamond Pair" = "Par en diamante"
"Static clicking. Two small spheres sit on a 5 × 5 lattice of fixed points; each kill moves one\nto another point. The final score is multiplied by the square root of your accuracy. Trains\nshort, precise flicks between nearby static targets." = "Clic estático. Dos esferas pequeñas ocupan una red de 5 × 5 puntos fijos; cada baja mueve una a otro punto. La puntuación final se multiplica por la raíz cuadrada de tu precisión. Entrena flicks cortos y precisos entre objetivos estáticos cercanos."
"Crouch Spam" = "Spam de agachadas"
"Clicking against crouch spam. One agent strafes, stops and often crouches mid-duel, dropping its head ≈0.5 m in 0.15 s.\nWatch the head, not the body: when it ducks, bring the crosshair down with it and tap; when it stands, come back up.\nIt leaves after 3 s." = "Clic contra spam de agachadas. Un agente hace strafe, se detiene y a menudo se agacha en mitad del duelo, bajando la cabeza ≈0.5 m en 0.15 s.\nMira la cabeza, no el cuerpo: cuando se agacha, baja el crosshair con ella y dispara; cuando se levanta, vuelve a subir.\nSe va a los 3 s."
"Juke Heads" = "Cabezas con jukes"
"Dynamic clicking against jukes. Two agents strafe with VALORANT rifle movement, but half of their moves are quick A-D taps\nthat reverse almost at once, and some end in a full stop. Do not chase the juke: keep the crosshair on the head line and\ntap when they stop or reverse. They leave after 3 s." = "Clic dinámico contra jukes. Dos agentes hacen strafe con movimiento de rifle de VALORANT, pero la mitad de sus movimientos son toques rápidos de A-D que se invierten casi al instante, y algunos terminan en una parada completa. No persigas el juke: mantén el crosshair en la línea de cabeza y dispara cuando se detengan o cambien de dirección. Se van a los 3 s."
"Jump Spotting" = "Lectura de saltos"
"Clicking against jumpers. Agents strafe and often jump, rising ≈0.9 m with no air control, so an airborne agent keeps\nits line and lands where you can predict. Either click the head in the air or pre-aim the landing spot and tap as it\ntouches down. They leave after 3 s." = "Clic contra saltadores. Los agentes hacen strafe y saltan a menudo, subiendo ≈0.9 m sin control en el aire, así que un agente en el aire mantiene su línea y cae donde puedes predecir. Haz clic en la cabeza en el aire o apunta de antemano al punto de caída y dispara cuando toque el suelo. Se van a los 3 s."
"Evasive Micro Clicks" = "Micro clics evasivos"
"Microcorrection against an evasive target. A head-sized sphere appears 1.5–5° from your crosshair and immediately jukes,\nstops and sometimes ducks. Fix the small error with a short correction and click on the stop; overcorrecting into a\nreversal is the miss this drill punishes. It leaves after 2.5 s." = "Microcorrección contra un objetivo evasivo. Una esfera del tamaño de una cabeza aparece a 1.5–5° de tu crosshair y de inmediato hace jukes, se detiene y a veces se agacha. Corrige el pequeño error con una corrección corta y haz clic en la parada; corregir de más hacia un cambio de dirección es el fallo que este ejercicio castiga. Se va a los 2.5 s."
"Juke Peek" = "Peek con juke"
"Hold an angle against a jiggle peeker. After a random 0.6–2.0 s wait, an agent appears near your crosshair at head height,\njukes and sometimes crouches, then leaves after 1.6 s. React to the appearance, but shoot on the stop or the reversal,\nnot while it is crossing your crosshair at full speed." = "Mantén un ángulo contra alguien que hace jiggle peek. Tras una espera aleatoria de 0.6–2.0 s, un agente aparece cerca de tu crosshair a la altura de la cabeza, hace jukes y a veces se agacha, y se va a los 1.6 s. Reacciona a su aparición, pero dispara en la parada o en el cambio de dirección, no mientras cruza tu crosshair a toda velocidad."
"Dot Sweep" = "Barrido de puntos"
"Static speed switching. Three small dots sit in a ±30° cone; each needs 0.35 s of holding the\ncrosshair on it while firing. Finish one and sweep straight to the next. Trains settling on\na target at once and leaving it the moment it dies." = "Cambio de objetivo rápido estático. Tres puntos pequeños están en un cono de ±30°; cada uno necesita 0.35 s con el crosshair encima mientras disparas. Termina uno y barre directo al siguiente. Entrena asentarte en un objetivo al instante y dejarlo en cuanto muere."
"Drifting Heads" = "Cabezas a la deriva"
"Linear clicking. Head-sized spheres slide across a wide, low band in long horizontal runs,\nrising and falling a little as they bounce between its top and bottom edges. Trains\nclicking a small target on a long, mostly horizontal path." = "Clic lineal. Esferas del tamaño de una cabeza se deslizan por una franja ancha y baja en recorridos horizontales largos, subiendo y bajando un poco al rebotar entre sus bordes superior e inferior. Entrena hacer clic en un objetivo pequeño en una trayectoria larga y casi horizontal."
"Strafing Heads" = "Cabezas con strafe"
"Dynamic clicking. Two agents A/D strafe with real VALORANT rifle movement (5.4 m/s, measured stopping curves).\nRead their movement and tap the head; they leave after 3 s." = "Clic dinámico. Dos agentes hacen strafe A/D con el movimiento real de rifle de VALORANT (5.4 m/s, curvas de frenado medidas).\nLee su movimiento y dispara a la cabeza; se van a los 3 s."
"Fade Track" = "Tracking que se desvanece"
"Tracking under a clock. Each sphere fades out within 3 s, and its value fades with it.\nGet on it at once and stay on it: the points come from the time on target before it is gone." = "Tracking contra el reloj. Cada esfera se desvanece en 3 s y su valor se desvanece con ella.\nPonte encima de inmediato y quédate: los puntos salen del tiempo en el objetivo antes de que desaparezca."
"Headshot Flicks" = "Flicks a la cabeza"
"VALORANT-sized agents appear 10–47° to either side at 10–30 m, always inside VALORANT's\nview. Only headshots count. Trains flicking straight to head level, as in an entry or\nretake duel." = "Agentes del tamaño de VALORANT aparecen a 10–47° a cualquier lado, a 10–30 m, siempre dentro de la vista de VALORANT. Solo cuentan los headshots. Entrena hacer flicks directo a la altura de la cabeza, como en un duelo de entrada o de retake."
"Wide Flicks" = "Flicks amplios"
"Static clicking with large flicks: one target appears 20–47° away from your crosshair,\nalways inside VALORANT's view, so you flick to it instead of searching for it.\nTrains arm-driven flicks and stopping cleanly on target." = "Clic estático con flicks grandes: un objetivo aparece a 20–47° de tu crosshair, siempre dentro de la vista de VALORANT, así que haces flick hacia él en lugar de buscarlo.\nEntrena flicks con el brazo y detenerte limpiamente en el objetivo."
"Flinch Stop" = "Parada refleja"
"React and stop. Keep strafing: an agent appears after a random wait and stays for only 1.5 s.\nCounter-strafe the moment you see it and tap the head. A hit within 0.25 s of your stop earns a bonus; letting it leave or shooting on the move costs points." = "Reacciona y detente. Sigue haciendo strafe: un agente aparece tras una espera aleatoria y solo se queda 1.5 s.\nHaz counter-strafe en cuanto lo veas y dispara a la cabeza. Un acierto dentro de 0.25 s de tu parada da bonus; dejarlo ir o disparar en movimiento cuesta puntos."
"Fly Switch" = "Cambio entre voladores"
"Evasive switching in three dimensions. Three spheres wander up, down and sideways and also\nmove towards and away from you; each needs 0.6 s of tracking while firing. Trains holding a\ntarget whose size and path both change before switching." = "Cambio de objetivo evasivo en tres dimensiones. Tres esferas vagan arriba, abajo y a los lados, y también se acercan y alejan de ti; cada una necesita 0.6 s de tracking mientras disparas. Entrena mantenerte en un objetivo cuyo tamaño y trayectoria cambian antes de pasar al siguiente."
"Four Shrink" = "Cuatro que encogen"
"Four spheres on a wide wall. Every kill shrinks all of them a little, down to 40% of their size.\nKeep flicking accurately as the targets get smaller." = "Cuatro esferas en una pared ancha. Cada baja encoge un poco a todas, hasta el 40% de su tamaño.\nSigue haciendo flicks precisos a medida que los objetivos se hacen más pequeños."
"Go / No-Go" = "Disparar / No disparar"
"Decision clicking. Targets appear 4–15° from your crosshair: shoot the solid ones, but leave the\nfaint grey decoys alone until they vanish. A decoy shot costs 150 points; a solid target you let\nexpire costs 50. Trains telling friend from foe before you click." = "Clic de decisión. Los objetivos aparecen a 4–15° de tu crosshair: dispara a los sólidos, pero deja en paz los señuelos grises tenues hasta que desaparezcan. Disparar a un señuelo cuesta 150 puntos; dejar que expire un objetivo sólido cuesta 50. Entrena distinguir aliado de enemigo antes de hacer clic."
"Head Rail Run" = "Carril a la altura de la cabeza"
"Crosshair placement on the move. Agents pop up at different distances along the lane while you strafe.\nKeep the crosshair at head height as you move, so each one needs only a small adjustment, then stop and tap. Heads stay 1.8 s and are worth less the longer you take; moving shots lose points." = "Colocación del crosshair en movimiento. Los agentes aparecen a distintas distancias a lo largo del carril mientras haces strafe.\nMantén el crosshair a la altura de la cabeza mientras te mueves, para que cada uno solo necesite un pequeño ajuste; luego detente y dispara. Las cabezas duran 1.8 s y valen menos cuanto más tardas; los disparos en movimiento pierden puntos."
"Hop Field" = "Campo de saltos"
"Dynamic clicking. Small spheres leap off the floor in arcs and keep bouncing until they run\nout of hops. Click each one before it lands for good. Trains leading a target whose vertical\nspeed changes all the time." = "Clic dinámico. Esferas pequeñas saltan del suelo en arcos y siguen rebotando hasta quedarse sin saltos. Haz clic en cada una antes de que caiga del todo. Entrena adelantarte a un objetivo cuya velocidad vertical cambia todo el tiempo."
"Hop Switch" = "Cambio entre saltarines"
"Switching on hoppers. Spheres hop slowly under low gravity; each needs 0.35 s of tracking\nwhile firing, and one that lands for good is lost. Trains following a smooth vertical arc\nand switching before the next one lands." = "Cambio de objetivo con saltarines. Las esferas saltan despacio con gravedad baja; cada una necesita 0.35 s de tracking mientras disparas, y la que cae del todo se pierde. Entrena seguir un arco vertical suave y cambiar antes de que caiga la siguiente."
"Jitter Switch" = "Cambio con jitter"
"Evasive switching. Three spheres make short strafes with real acceleration and stops, changing\ndirection every 0.15–0.35 s; each needs 0.4 s of tracking while firing. Trains staying on a\ntarget through quick reversals before switching." = "Cambio de objetivo evasivo. Tres esferas hacen strafes cortos con aceleración y paradas reales, cambiando de dirección cada 0.15–0.35 s; cada una necesita 0.4 s de tracking mientras disparas. Entrena mantenerte en un objetivo a través de cambios de dirección rápidos antes de pasar al siguiente."
"Ground Reactive" = "Reactivo en el suelo"
"Reactive tracking. A capsule strafes on the ground in every direction, left, right, towards and\naway from you, with fast jukes and stops. Hold fire and react to each change instead of predicting." = "Tracking reactivo. Una cápsula hace strafe por el suelo en todas las direcciones, izquierda, derecha, hacia ti y alejándose, con jukes y paradas rápidas. Mantén el disparo y reacciona a cada cambio en lugar de predecirlo."
"Head Strafe Track" = "Tracking de cabeza con strafe"
"Stability tracking. A very thin capsule with a small head does fast, short A/D strafes.\nHead time scores twice body time: stay on the head through every reversal." = "Tracking de estabilidad. Una cápsula muy delgada con una cabeza pequeña hace strafes A/D cortos y rápidos.\nEl tiempo en la cabeza puntúa el doble que en el cuerpo: mantente en la cabeza en cada cambio de dirección."
"Long Range Heads" = "Cabezas a larga distancia"
"Precision. Static agents stand at 35–50 m, where a head is only ≈0.3°. Small flicks, full stop, one clean tap.\nMisses cost a lot, so take the time you need." = "Precisión. Agentes estáticos a 35–50 m, donde una cabeza mide solo ≈0.3°. Flicks pequeños, parada completa, un disparo limpio.\nLos fallos cuestan mucho, así que tómate el tiempo que necesites."
"Micro Adjust" = "Microajuste"
"Static clicking. A head-sized target appears 1.5–6° from your crosshair; fix the small error and click.\nTrains the finger/wrist corrections that turn near-misses into headshots." = "Clic estático. Un objetivo del tamaño de una cabeza aparece a 1.5–6° de tu crosshair; corrige el pequeño error y haz clic.\nEntrena las correcciones de dedos y muñeca que convierten casi-fallos en headshots."
"Mini Regen Switch" = "Mini cambio con regeneración"
"Switching against regeneration. Two small spheres strafe; each needs 0.5 s of tracking while\nfiring, and heals if you leave it for 0.3 s. Finish what you start before switching.\nTrains committing to a kill under pressure." = "Cambio de objetivo contra regeneración. Dos esferas pequeñas hacen strafe; cada una necesita 0.5 s de tracking mientras disparas y se cura si la dejas 0.3 s. Termina lo que empiezas antes de cambiar.\nEntrena comprometerte con una baja bajo presión."
"Micro Cluster" = "Grupo micro"
"Micro flicks. Three tiny spheres sit on a tight 3 x 4 grid just above the crosshair.\nKill them one after another with small, exact corrections." = "Micro flicks. Tres esferas diminutas ocupan una cuadrícula cerrada de 3 x 4 justo encima del crosshair.\nElimínalas una tras otra con correcciones pequeñas y exactas."
"Micro Pace" = "Ritmo micro"
"Micro distances at your own pace. A tiny sphere appears 1-4 degrees from your crosshair.\nThe final score is multiplied by your accuracy, so a miss costs more than a slower click." = "Distancias micro a tu propio ritmo. Una esfera diminuta aparece a 1-4 grados de tu crosshair.\nLa puntuación final se multiplica por tu precisión, así que un fallo cuesta más que un clic más lento."
"Mini Phase" = "Mini fases"
"Four 15 s phases in one run: wide static spheres, small static spheres, strafing spheres and\nsmall strafing spheres. Adapt your flick to each change without slowing down." = "Cuatro fases de 15 s en una partida: esferas estáticas grandes, esferas estáticas pequeñas, esferas con strafe y esferas pequeñas con strafe. Adapta tu flick a cada cambio sin bajar el ritmo."
"Mirror Duel" = "Duelo espejo"
"An A/D duel against an agent that answers your strafe. Half the time it copies a new strafe of yours, a third of the time it turns against it.\nIts rhythm follows yours, not a timer, so you cannot time its turns. Strafe, stop when the head settles, and tap it. Moving shots lose points." = "Un duelo A/D contra un agente que responde a tu strafe. La mitad de las veces copia tu nuevo strafe y un tercio de las veces va en contra.\nSu ritmo sigue al tuyo, no a un temporizador, así que no puedes medir sus giros. Haz strafe, detente cuando la cabeza se asiente y dispárale. Los disparos en movimiento pierden puntos."
"Orbit Track" = "Tracking orbital"
"Control tracking. A sphere circles around you, sometimes turning back; every five seconds a new\none takes over at a new speed. Turn with it and match its pace." = "Tracking de control. Una esfera gira a tu alrededor y a veces da la vuelta; cada cinco segundos otra toma el relevo a una nueva velocidad. Gira con ella e iguala su ritmo."
"Angle Hold" = "Mantener ángulo"
"Hold an angle. After a random 0.6–2.5 s wait, an agent peeks at head height near your crosshair and strafes back after 1.5 s.\nPre-aim the head line and react. Average time-to-kill is your reaction-plus-adjust time." = "Mantén un ángulo. Tras una espera aleatoria de 0.6–2.5 s, un agente hace peek a la altura de la cabeza cerca de tu crosshair y vuelve a cubrirse a los 1.5 s.\nApunta de antemano a la línea de cabeza y reacciona. El tiempo medio para eliminar es tu tiempo de reacción más ajuste."
"Peek Track" = "Tracking de peeks"
"Stability tracking. A capsule peeks out, strafes back and forth and ducks away after 3 s.\nGet on it as it appears and track it until it leaves." = "Tracking de estabilidad. Una cápsula hace peek, hace strafe de un lado a otro y se esconde a los 3 s.\nPonte encima en cuanto aparezca y síguela hasta que se vaya."
"Kill Race" = "Carrera de bajas"
"A race to 30 kills: flick to each sphere as soon as it appears, because its value fades while it waits.\nThe warm-up wave uses big spheres until you hit 75% of at least 6 shots; then they shrink.\nAccuracy still counts: every miss costs points. Running out of the 60 s fails the run." = "Una carrera hasta 30 bajas: haz flick a cada esfera en cuanto aparezca, porque su valor se desvanece mientras espera.\nLa oleada de calentamiento usa esferas grandes hasta que aciertes el 75% de al menos 6 disparos; luego encogen.\nLa precisión sigue contando: cada fallo cuesta puntos. Si se acaban los 60 s, la partida falla."
"Peek Ladder" = "Escalera de peeks"
"Waves: clear three close heads, then catch a far peeker before it ducks back; later waves strafe\nand send peekers in pairs, then a mixed finale runs until time is up.\nFive misses fail the run, and so does a close wave left standing too long." = "Oleadas: elimina tres cabezas cercanas y luego atrapa a un peeker lejano antes de que se cubra; las oleadas posteriores hacen strafe y mandan peekers en parejas, y un final mixto dura hasta que se acaba el tiempo.\nCinco fallos hacen fallar la partida, igual que dejar una oleada cercana en pie demasiado tiempo."
"Peripheral Flash" = "Destello periférico"
"Keep your crosshair still in the middle. A small dot flashes for 0.5 s in one of eight areas\naround it, 6–18° away; click (anywhere, no need to aim) as soon as you see one. Some trials stay\nblank: a click with no flash is a false alarm and costs 50. Trains noticing enemies at the edge of\nyour vision." = "Mantén tu crosshair quieto en el centro. Un punto pequeño destella 0.5 s en una de ocho zonas a su alrededor, a 6–18°; haz clic (en cualquier sitio, no hace falta apuntar) en cuanto veas uno. Algunos intentos quedan vacíos: un clic sin destello es una falsa alarma y cuesta 50. Entrena notar enemigos en el borde de tu visión."
"Pill Crossfire" = "Fuego cruzado de cápsulas"
"Dynamic multi-target clicking. Three capsules juke and stop across a wide arc; the small head is worth\nmore than twice the body. Pick the next target while the last shot lands, and aim for the head." = "Clic dinámico con varios objetivos. Tres cápsulas hacen jukes y se detienen a lo largo de un arco amplio; la pequeña cabeza vale más del doble que el cuerpo. Elige el siguiente objetivo mientras cae el último disparo y apunta a la cabeza."
"Popcorn Burst" = "Palomitas"
"Bouncing arcs. Spheres pop up at very different launch speeds and bounce three times before\nthey land for good. Click each one; low hops and high pops need different leads. Trains\nadapting the click timing to each arc." = "Arcos que rebotan. Las esferas saltan con velocidades de lanzamiento muy distintas y rebotan tres veces antes de caer del todo. Haz clic en cada una; los saltos bajos y los altos necesitan adelantos distintos. Entrena adaptar el timing del clic a cada arco."
"Precision Rings" = "Anillos de precisión"
"Static clicking for precision. A target appears 3–15° from your crosshair; a hit scores more\nthe closer it lands to the center (×3 inner ring, ×2 middle, ×1 edge).\nTrains landing on the exact point you aim at, not just anywhere on the target." = "Clic estático de precisión. Un objetivo aparece a 3–15° de tu crosshair; un acierto puntúa más cuanto más cerca del centro cae (×3 anillo interior, ×2 medio, ×1 borde).\nEntrena caer en el punto exacto al que apuntas, no en cualquier parte del objetivo."
"Pressure Balloons" = "Globos bajo presión"
"Pressure clicking. Large spheres float in from far away and leave after 3.5 s. Pop each one\nbefore it goes: the fifth balloon that escapes fails the run. Trains staying fast and\naccurate while targets pile up." = "Clic bajo presión. Esferas grandes llegan flotando desde lejos y se van a los 3.5 s. Revienta cada una antes de que se vaya: el quinto globo que escapa hace fallar la partida. Entrena mantenerte rápido y preciso mientras los objetivos se acumulan."
"Prism Bounce" = "Rebote en prisma"
"Switching inside a pentagon. Three spheres float slowly in straight lines and ricochet off the\nwalls of a pentagon; each needs 0.4 s of tracking while firing. Trains re-acquiring a target\nright after a ricochet and switching to the next." = "Cambio de objetivo dentro de un pentágono. Tres esferas flotan despacio en línea recta y rebotan en las paredes de un pentágono; cada una necesita 0.4 s de tracking mientras disparas. Entrena recuperar un objetivo justo después de un rebote y pasar al siguiente."
"Radar Recall" = "Memoria de radar"
"Glance at the radar: for 1.5 s it shows where 2 enemies stand. Then 4 identical agents appear;\nshoot only the 2 the radar showed and leave the others alone until they vanish. A wrong pick costs\n150, a missed enemy 50. Trains reading the minimap and committing to the right angle." = "Mira el radar: durante 1.5 s muestra dónde están 2 enemigos. Luego aparecen 4 agentes idénticos; dispara solo a los 2 que mostró el radar y deja en paz a los demás hasta que desaparezcan. Elegir mal cuesta 150 y dejar escapar a un enemigo, 50. Entrena leer el minimapa y comprometerte con el ángulo correcto."
"Reactive Duel" = "Duelo reactivo"
"Duel an agent that holds its angle but reacts to you: it may copy or counter your A/D strafe,\ndodges when your crosshair gets close, and jukes when you fire. Once hit it strafes hard,\nand under half health it backs off. Three hits kill. Stop moving before you shoot." = "Enfréntate a un agente que mantiene su ángulo pero reacciona a ti: puede copiar o contrarrestar tu strafe A/D, esquiva cuando tu crosshair se acerca y hace jukes cuando disparas. Al recibir un impacto hace strafe fuerte, y con menos de la mitad de vida retrocede. Tres impactos lo eliminan. Deja de moverte antes de disparar."
"Reactive Flick" = "Flick reactivo"
"Two-hit flicks. A sphere waits still until you hit it; then it strafes away and needs a\nsecond hit. Trains a clean first flick followed by an immediate correction onto a target\nthat just started moving." = "Flicks de dos impactos. Una esfera espera quieta hasta que la aciertas; entonces se aleja con strafe y necesita un segundo impacto. Entrena un primer flick limpio seguido de una corrección inmediata sobre un objetivo que acaba de empezar a moverse."
"Reflex Flick" = "Flick reflejo"
"Reaction flicks. One sphere appears up to 30° from your crosshair and leaves after 1.2 s.\nFlick and click before it goes; an expired target costs points. Play it at an easier or\nharder difficulty level for a longer or shorter lifetime." = "Flicks de reacción. Una esfera aparece hasta a 30° de tu crosshair y se va a los 1.2 s.\nHaz flick y clic antes de que se vaya; un objetivo que expira cuesta puntos. Juégalo en un nivel de dificultad más fácil o más difícil para que dure más o menos."
"Regen Track" = "Tracking con regeneración"
"Track a strafing sphere until it dies. It heals whenever your crosshair leaves it for 0.3 s,\nand its points per second fade the longer it lives, so only steady, unbroken tracking kills\nit quickly and keeps the score high. Hold fire the whole time." = "Sigue a una esfera que hace strafe hasta que muera. Se cura cada vez que tu crosshair la deja 0.3 s, y sus puntos por segundo bajan cuanto más vive, así que solo un tracking constante y sin cortes la elimina rápido y mantiene la puntuación alta. Mantén el disparo todo el tiempo."
"Ricochet Ring" = "Anillo de rebotes"
"Linear clicking. Two spheres travel in straight lines and ricochet off the walls of an octagon\nin front of you. Click each one; the replacement starts a new line. Trains clicking on a\nconstant-velocity target and re-reading it after each ricochet." = "Clic lineal. Dos esferas viajan en línea recta y rebotan en las paredes de un octágono frente a ti. Haz clic en cada una; la que la reemplaza empieza una nueva línea. Entrena hacer clic en un objetivo de velocidad constante y volver a leerlo tras cada rebote."
"Shrinking Movers" = "Móviles que encogen"
"Dynamic clicking under growing pressure. Three spheres wander across the wall, and every kill shrinks\nall of them a little, down to 40% of their size. Keep clicking cleanly as they get smaller." = "Clic dinámico con presión creciente. Tres esferas vagan por la pared y cada baja encoge un poco a todas, hasta el 40% de su tamaño. Sigue haciendo clics limpios a medida que se hacen más pequeñas."
"Six Pin" = "Seis pines"
"Static clicking. Six small spheres stay on the wall at all times; each kill puts a new one\nsomewhere else. The final score is multiplied by your accuracy, so a fast miss costs more\nthan a slow hit. Trains clean, confirmed clicks on stationary targets." = "Clic estático. Seis esferas pequeñas están siempre en la pared; cada baja pone una nueva en otro sitio. La puntuación final se multiplica por tu precisión, así que un fallo rápido cuesta más que un acierto lento. Entrena clics limpios y confirmados en objetivos quietos."
"Skeet Arcs" = "Arcos de tiro al plato"
"Clay-shooting arcs. Spheres are launched from the floor ahead and fly one parabola before\nlanding. Click each one in the air; a landed target costs points. Trains leading a target\nwhose path curves under gravity." = "Arcos de tiro al plato. Las esferas se lanzan desde el suelo delante de ti y vuelan una parábola antes de caer. Haz clic en cada una en el aire; un objetivo que cae cuesta puntos. Entrena adelantarte a un objetivo cuya trayectoria se curva por la gravedad."
"Sky Reactive" = "Reactivo en el cielo"
"Reactive tracking. A sphere flies above the horizon and changes direction often and fast.\nFour 15 s phases alternate far and close: far trains small corrections, close trains fast ones." = "Tracking reactivo. Una esfera vuela por encima del horizonte y cambia de dirección a menudo y rápido.\nCuatro fases de 15 s alternan lejos y cerca: lejos entrena correcciones pequeñas, cerca entrena correcciones rápidas."
"Smooth XYZ" = "XYZ suave"
"Control tracking. A sphere moves on all three axes, sideways, up and down, towards and away,\nwith smooth changes of direction and speed. Hold fire and keep the crosshair centered as it changes size." = "Tracking de control. Una esfera se mueve en los tres ejes, a los lados, arriba y abajo, hacia ti y alejándose, con cambios suaves de dirección y velocidad. Mantén el disparo y el crosshair centrado mientras cambia de tamaño."
"Snap Reflex" = "Reflejo rápido"
"Reflex flicks. One head-sized sphere at a time appears at a random height and depth.\nIts value fades over 1.2 s, so a fast, clean flick scores up to four times a slow one." = "Flicks reflejos. Una esfera del tamaño de una cabeza aparece a la vez a una altura y profundidad aleatorias.\nSu valor se desvanece en 1.2 s, así que un flick rápido y limpio puntúa hasta cuatro veces más que uno lento."
"Sound Turn" = "Giro al sonido"
"Turn to the sound. Each agent is first only heard: synthesized footsteps from your sides or behind\nyou. It appears 0.8 s later, or as soon as your crosshair gets within 25° of it. Turn towards the\nsound at once, then take the head. Use headphones; the results show your error and turn time per\ndirection." = "Gira hacia el sonido. Al principio cada agente solo se oye: pasos sintetizados a tus lados o detrás de ti. Aparece 0.8 s después, o en cuanto tu crosshair quede a menos de 25° de él. Gira hacia el sonido de inmediato y luego ve por la cabeza. Usa audífonos; los resultados muestran tu error y tu tiempo de giro por dirección."
"Spider Strafe" = "Spider con strafe"
"Spider shot on the move. Shoot the centre sphere, strafe, stop, shoot the sphere that appears 4–10° around it, strafe again, and come back to the centre.\nThe centre stays in one place while you move. A hit within 0.4 s of an accurate stop scores 60 more than a standing shot, so moving between shots is most of the score; moving shots lose points." = "Spider shot en movimiento. Dispara a la esfera central, haz strafe, detente, dispara a la esfera que aparece a 4–10° a su alrededor, vuelve a hacer strafe y regresa al centro.\nEl centro se queda en su sitio mientras te mueves. Un acierto dentro de 0.4 s de una parada precisa puntúa 60 más que un disparo quieto, así que moverte entre disparos es la mayor parte de la puntuación; los disparos en movimiento pierden puntos."
"Spider Web" = "Telaraña"
"Centre, out, centre. A sphere sits in the middle; shoot it and another appears 6–16° away in any direction. Shoot that and the centre comes back.\nFlick out and flick home every time: the flick home trains returning to your crosshair placement." = "Centro, afuera, centro. Una esfera está en el medio; dispárale y aparece otra a 6–16° en cualquier dirección. Dispara a esa y vuelve el centro.\nHaz flick hacia afuera y flick de vuelta cada vez: el flick de vuelta entrena regresar a tu colocación del crosshair."
"Spray Transfer" = "Transferencia de spray"
"Spray transfers with the Phantom (recoil on: hold to fire full-auto). Three agents stand close together\nat 10–15 m and take three hits each. Kill all three in one spray: pull down against the climb and drag\nthe spray from body to body. Body shots count, so start on the chest and let the climb walk up." = "Transferencias de spray con la Phantom (retroceso activado: mantén pulsado para disparo automático). Tres agentes están juntos a 10–15 m y necesitan tres impactos cada uno. Elimina a los tres en un solo spray: tira hacia abajo contra la subida y arrastra el spray de cuerpo en cuerpo. Los disparos al cuerpo cuentan, así que empieza en el pecho y deja que la subida avance."
"Spread Flicks" = "Flicks dispersos"
"One target at a time anywhere in an 80° arc, but never near the last two spawns, never\nwithin 12° of your crosshair and never in the middle of the arc. Every kill forces a real\nflick in a new direction, so you cannot settle into one comfortable motion." = "Un objetivo a la vez en cualquier parte de un arco de 80°, pero nunca cerca de las dos últimas apariciones, nunca a menos de 12° de tu crosshair y nunca en el medio del arco. Cada baja obliga a un flick real en una nueva dirección, así que no puedes acomodarte en un movimiento cómodo."
"Spread Gate" = "Puerta de dispersión"
"Only a full stop lands. Small spheres sit far away and the Phantom fires with its spread: a shot above 27.5% of run speed sprays up to 6° off and misses at this range.\nStrafe between spheres, stop fully, then shoot. Misses are expensive and the score scales with accuracy." = "Solo acierta una parada completa. Esferas pequeñas están lejos y la Phantom dispara con su dispersión: un disparo por encima del 27.5% de la velocidad de carrera se desvía hasta 6° y falla a esta distancia.\nHaz strafe entre esferas, detente por completo y luego dispara. Los fallos son caros y la puntuación escala con la precisión."
"Squad Strafe" = "Escuadrón con strafe"
"Everyone moves. Three agents strafe and juke at once while you strafe too.\nPick one, counter-strafe, tap the head, and move again before you take the next. A hit within 0.3 s of your stop earns a bonus; moving shots lose points." = "Todos se mueven. Tres agentes hacen strafe y jukes a la vez mientras tú también haces strafe.\nElige uno, haz counter-strafe, dispara a la cabeza y vuelve a moverte antes de ir por el siguiente. Un acierto dentro de 0.3 s de tu parada da bonus; los disparos en movimiento pierden puntos."
"Headline Static" = "Línea de cabeza estática"
"Static clicking at head height. Three heads float in a horizontal band at agent head height and mixed depth.\nKeep the crosshair on the head line and only make small horizontal corrections." = "Clic estático a la altura de la cabeza. Tres cabezas flotan en una franja horizontal a la altura de la cabeza de un agente y a distintas profundidades.\nMantén el crosshair en la línea de cabeza y haz solo pequeñas correcciones horizontales."
"Stop-and-Go Weavers" = "Zigzagueantes con paradas"
"Dynamic clicking on targets that keep changing their pattern. Each sphere switches between a smooth wave,\na sharp zigzag and short stops. Re-read the motion after every change instead of trusting the last one." = "Clic dinámico en objetivos que cambian de patrón constantemente. Cada esfera alterna entre una onda suave, un zigzag brusco y paradas cortas. Vuelve a leer el movimiento tras cada cambio en lugar de confiar en el anterior."
"Strafe Shot" = "Disparo con strafe"
"Keep moving between shots. Four targets sit at different heights. Strafe, stop, shoot one, and strafe again.\nMoving shots are inaccurate and penalised, so this drills the move, stop, shoot rhythm." = "Sigue moviéndote entre disparos. Cuatro objetivos están a distintas alturas. Haz strafe, detente, dispara a uno y vuelve a hacer strafe.\nLos disparos en movimiento son imprecisos y se penalizan, así que esto entrena el ritmo de moverse, detenerse y disparar."
"Stutter Ladder" = "Escalera de stutter"
"Counter-strafe on a shrinking clock. Strafe with A/D, tap the opposite key to stop, and hit the head before the agent leaves.\nEvery 8 kills the head stays for less time: 2.6 s, 2.0 s, 1.5 s, then 1.1 s. A hit within 0.3 s of your stop earns a bonus; moving shots lose points." = "Counter-strafe con un reloj cada vez más corto. Haz strafe con A/D, toca la tecla contraria para detenerte y acierta la cabeza antes de que el agente se vaya.\nCada 8 bajas la cabeza dura menos: 2.6 s, 2.0 s, 1.5 s y luego 1.1 s. Un acierto dentro de 0.3 s de tu parada da bonus; los disparos en movimiento pierden puntos."
"Evasive Micro Switch" = "Micro cambio evasivo"
"Evasive switching with small targets. Three head-sized targets drift and need 0.3 s of\ntracking each. Smaller targets punish sloppy lock-on, so settle before you commit." = "Cambio de objetivo evasivo con objetivos pequeños. Tres objetivos del tamaño de una cabeza se deslizan y necesitan 0.3 s de tracking cada uno. Los objetivos más pequeños castigan un enganche descuidado, así que asiéntate antes de comprometerte."
"Evasive Switch" = "Cambio evasivo"
"Evasive switching (tracking-based kills). Three drifting targets each need 0.35 s of tracking to die.\nLock on, finish, and switch to the next one without overshooting." = "Cambio de objetivo evasivo (bajas por tracking). Tres objetivos que se deslizan necesitan 0.35 s de tracking cada uno para morir.\nEngánchate, termina y pasa al siguiente sin pasarte."
"Head Switch" = "Cambio entre cabezas"
"Speed switching between agents' heads. Three agents stand spread across a site at 10–20 m.\nOne tap per head, then snap straight to the next: the multi-kill pattern from a retake." = "Cambio de objetivo rápido entre cabezas de agentes. Tres agentes están repartidos por un sitio a 10–20 m.\nUn disparo por cabeza y salta directo a la siguiente: el patrón de varias bajas de un retake."
"Speed Switch" = "Cambio rápido"
"Speed switching. Four targets sit in a ±30° cone. Kill them one at a time as fast as possible.\nEach kill respawns a new target. Trains short, decisive switches with no hesitation." = "Cambio de objetivo rápido. Cuatro objetivos están en un cono de ±30°. Elimínalos uno a uno lo más rápido posible.\nCada baja hace aparecer un nuevo objetivo. Entrena cambios cortos y decididos, sin dudar."
"Wide Switch" = "Cambio amplio"
"Speed switching across a wide field of view. Three targets spawn up to 60° to each side.\nTrains large, decisive switches without overshooting." = "Cambio de objetivo rápido en un campo de visión amplio. Tres objetivos aparecen hasta a 60° a cada lado.\nEntrena cambios grandes y decididos sin pasarte."
"Tap Discipline" = "Disciplina de tapping"
"Long-range taps with the Vandal (recoil on). Agents stand at 30–40 m, where a head is ≈0.4°, and leave\nafter 1.2 s. Spread grows with every bullet of a burst, so only a fully recovered first bullet (wait about\n0.4 s between shots) is reliable here. Hits within the first 6 bullets of a burst earn a bonus; misses\ncost points." = "Disparos sueltos a larga distancia con la Vandal (retroceso activado). Los agentes están a 30–40 m, donde una cabeza mide ≈0.4°, y se van a los 1.2 s. La dispersión crece con cada bala de una ráfaga, así que aquí solo es fiable una primera bala totalmente recuperada (espera unos 0.4 s entre disparos). Los impactos dentro de las primeras 6 balas de una ráfaga dan bonus; los fallos cuestan puntos."
"Tempo Movers" = "Móviles a ritmo"
"Speed switching on movers. Three spheres glide in straight lines at one steady speed and\nbounce off the walls of a box; each needs 0.4 s of tracking while firing. Trains matching a\nknown velocity at once and switching on a steady rhythm." = "Cambio de objetivo rápido con objetivos móviles. Tres esferas se deslizan en línea recta a una velocidad constante y rebotan en las paredes de una caja; cada una necesita 0.4 s de tracking mientras disparas. Entrena igualar al instante una velocidad conocida y cambiar con un ritmo constante."
"Thin Glide" = "Deslizamiento fino"
"Precise tracking. A thin standing capsule glides on long, smooth paths at changing speeds.\nHold fire and keep the crosshair on its narrow body without overshooting." = "Tracking preciso. Una cápsula delgada de pie se desliza por trayectorias largas y suaves a velocidades cambiantes.\nMantén el disparo y el crosshair sobre su cuerpo estrecho sin pasarte."
"Close Strafe Track" = "Tracking de strafe cercano"
"Reactive tracking at close range, where strafes cover the most screen. An agent ADAD-strafes\nat knife speed 6–8 m away. Track the upper body and head, and react to every direction change." = "Tracking reactivo a corta distancia, donde los strafes cubren más pantalla. Un agente hace strafe ADAD a velocidad de cuchillo a 6–8 m. Sigue la parte superior del cuerpo y la cabeza, y reacciona a cada cambio de dirección."
"Precise tracking. A medium target drifts on long, smooth arcs around the horizon.\nMatch its speed instead of chasing it, and keep your crosshair centered." = "Tracking preciso. Un objetivo mediano se desliza en arcos largos y suaves alrededor del horizonte.\nIguala su velocidad en lugar de perseguirlo y mantén el crosshair centrado."
"Smooth Track" = "Tracking suave"
"Precise tracking. A large target glides on long, predictable paths. Hold fire and stay glued with smooth, steady mouse movement.\nGood as a warm-up (start slow, then speed up)." = "Tracking preciso. Un objetivo grande se desliza por trayectorias largas y predecibles. Mantén el disparo y quédate pegado con un movimiento de mouse suave y constante.\nBueno como calentamiento (empieza lento y luego acelera)."
"Micro Reactive Track" = "Tracking micro reactivo"
"Reactive micro-tracking. A small, head-sized target changes direction quickly in a tight area.\nTrains tiny, fast corrections, the same ones you need to stay on a jiggling head." = "Micro tracking reactivo. Un objetivo pequeño, del tamaño de una cabeza, cambia de dirección rápido en un área reducida.\nEntrena correcciones diminutas y rápidas, las mismas que necesitas para seguir una cabeza que hace jiggle."
"Reactive Strafe Track" = "Tracking reactivo de strafe"
"Reactive tracking against a VALORANT agent doing short, unpredictable A/D strafes, stops included.\nReact instead of predicting. Head time scores more than body time." = "Tracking reactivo contra un agente de VALORANT que hace strafes A/D cortos e impredecibles, con paradas incluidas.\nReacciona en lugar de predecir. El tiempo en la cabeza puntúa más que en el cuerpo."
"Wave Runners" = "Corredores de ola"
"Dynamic clicking. Spheres glide across a wide band while bobbing up and down on a smooth wave.\nRead where the wave is heading and click as the sphere slows at the top or bottom." = "Clic dinámico. Las esferas se deslizan por una franja ancha mientras suben y bajan sobre una onda suave.\nLee hacia dónde va la onda y haz clic cuando la esfera frene arriba o abajo."
"Wide Wall Five" = "Cinco en pared ancha"
"Static clicking with an ammo economy. Five medium spheres spread over a 100° wall. Each shot\ncosts 30 of a 100 clip and each hit refunds 37, so three misses in a row force a reload.\nTrains long flicks that still land on the first click." = "Clic estático con economía de munición. Cinco esferas medianas repartidas en una pared de 100°. Cada disparo cuesta 30 de un cargador de 100 y cada acierto devuelve 37, así que tres fallos seguidos fuerzan una recarga.\nEntrena flicks largos que aun así aciertan al primer clic."
"Zigzag Sparks" = "Chispas en zigzag"
"Dynamic clicking. Small spheres drift sideways on a sharp zigzag: they climb and fall at a steady speed\nand snap into each turn. Trains clicking a target whose vertical direction flips without warning." = "Clic dinámico. Esferas pequeñas se deslizan de lado en un zigzag brusco: suben y bajan a velocidad constante y giran de golpe en cada vuelta. Entrena hacer clic en un objetivo cuya dirección vertical cambia sin aviso."

# Routines (content/routines): names, descriptions and block notes
"Aim and Duel" = "Puntería y duelo"
"Ten minutes of clicking and switching drills, then two shortened deathmatches, a mixed-squad deathmatch and an angle-clearing run on original maps." = "Diez minutos de ejercicios de clic y de cambio de objetivo, luego dos deathmatches cortos, un deathmatch contra un escuadrón mixto y una partida de limpieza de ángulos en mapas originales."
"Smooth tracking first: settle the hand." = "Primero tracking suave: asienta la mano."
"Small corrections at head height." = "Correcciones pequeñas a la altura de la cabeza."
"Fast target switching with a clean stop." = "Cambio de objetivo rápido con una parada limpia."
"Now with bots: pre-aim head height, take first-shot duels." = "Ahora con bots: apunta de antemano a la altura de la cabeza y gana los duelos de primer disparo."
"Mixed personalities: read who you fight and change your peek." = "Personalidades mixtas: lee contra quién peleas y cambia tu peek."
"Clear the angles in order with your crosshair already placed." = "Limpia los ángulos en orden con el crosshair ya colocado."
"Dynamic Clicking (≈25 min)" = "Clic dinámico (≈25 min)"
"Clicking on targets that move: drifters, waves and zigzags, bobbing heads, ricochets, hops and arcs,\npattern switchers, shrinking movers, capsules and close-range strafers.\nA warm-up in order, one blocked run of each drill, then a shorter interleaved pass.\n≈25 min." = "Clic en objetivos que se mueven: deslizadores, ondas y zigzags, cabezas que oscilan, rebotes, saltos y arcos, objetivos que cambian de patrón, móviles que encogen, cápsulas y strafers a corta distancia.\nUn calentamiento en orden, una partida en bloque de cada ejercicio y luego una pasada intercalada más corta.\n≈25 min."
"Warm-up: keep the crosshair glued to the sphere, don't chase score." = "Calentamiento: mantén el crosshair pegado a la esfera, no persigas la puntuación."
"Warm-up: land the crosshair on the sphere's center and stop there." = "Calentamiento: lleva el crosshair al centro de la esfera y detente ahí."
"Learn it: put the crosshair on the drifter's path and click as it arrives." = "Apréndelo: pon el crosshair en la trayectoria del deslizador y haz clic cuando llegue."
"Learn it: click as the sphere slows at the top or bottom of its wave." = "Apréndelo: haz clic cuando la esfera frene arriba o abajo de su onda."
"Learn it: hold the head's column and time the click to the bob." = "Apréndelo: mantén la columna de la cabeza y ajusta el clic a la oscilación."
"Learn it: re-read the sphere's path after every ricochet." = "Apréndelo: vuelve a leer la trayectoria de la esfera tras cada rebote."
"Learn it: keep the crosshair on the head line and let the target come." = "Apréndelo: mantén el crosshair en la línea de cabeza y deja que el objetivo venga."
"Learn it: expect the sharp turn; click on the straight part of the zigzag." = "Apréndelo: espera el giro brusco; haz clic en la parte recta del zigzag."
"Learn it: click near the top of the hop, where the sphere slows down." = "Apréndelo: haz clic cerca de lo más alto del salto, donde la esfera frena."
"Learn it: lead the sphere along its arc." = "Apréndelo: adelántate a la esfera a lo largo de su arco."
"Learn it: each arc has its own height; time the click to it." = "Apréndelo: cada arco tiene su propia altura; ajusta el clic a ella."
"Learn it: re-read the motion after every change of pattern." = "Apréndelo: vuelve a leer el movimiento tras cada cambio de patrón."
"Learn it: same calm click as the targets get smaller." = "Apréndelo: el mismo clic tranquilo a medida que los objetivos se hacen más pequeños."
"Learn it: pick the next capsule while the shot lands; aim for the head." = "Apréndelo: elige la siguiente cápsula mientras cae el disparo; apunta a la cabeza."
"Learn it: up close, wait for the stop or reversal and tap the head." = "Apréndelo: de cerca, espera la parada o el cambio de dirección y dispara a la cabeza."
"Mixed: meet the wave at its top or bottom." = "Mixto: encuentra la onda arriba o abajo."
"Mixed: click where the hop peaks." = "Mixto: haz clic donde el salto llega a lo más alto."
"Mixed: click between the turns." = "Mixto: haz clic entre los giros."
"Mixed: follow the new path after each bounce." = "Mixto: sigue la nueva trayectoria tras cada rebote."
"Mixed: vertical timing on a small head." = "Mixto: timing vertical en una cabeza pequeña."
"Mixed: read the arc's height before you click." = "Mixto: lee la altura del arco antes de hacer clic."
"Mixed: trust the motion you see now, not the last one." = "Mixto: confía en el movimiento que ves ahora, no en el anterior."
"Mixed: heads first, then the next target." = "Mixto: primero las cabezas, luego el siguiente objetivo."
"Mixed: small head, long path, calm click." = "Mixto: cabeza pequeña, trayectoria larga, clic tranquilo."
"Mixed: close range, tap on the stop." = "Mixto: corta distancia, dispara en la parada."
"Fundamentals Hour (≈52 min)" = "Hora de fundamentos (≈52 min)"
"Balanced fundamentals in the order Voltaic's skill routines use: tracking, then clicking, then switching.\nBlocks run in order (no interleaving), with long blocks to drill each skill.\nUse it on days you want depth over variety. Lower the block lengths if you get tired, since quality beats quantity." = "Fundamentos equilibrados en el orden que usan las rutinas de habilidad de Voltaic: tracking, luego clic y luego cambio de objetivo.\nLos bloques van en orden (sin intercalar), con bloques largos para practicar cada habilidad.\nÚsala los días en que quieras profundidad en lugar de variedad. Acorta los bloques si te cansas, porque la calidad gana a la cantidad."
"Opener." = "Apertura."
"Movement Builder (≈23 min)" = "Constructor de movimiento (≈23 min)"
"Shoot only when you are stopped: counter-strafes on a clock, mirror duels, crosshair placement on the move, W/S braking, crouch-spam duels, reaction stops, spread discipline, bursts after a stop, a moving squad and the spider shot.\nA warm-up in order, then every drill interleaved, so each run asks for a different stop.\n≈23 min; pair it with a flick or tracking routine on longer days." = "Dispara solo cuando estés detenido: counter-strafes contra el reloj, duelos espejo, colocación del crosshair en movimiento, frenado con W/S, duelos contra spam de agachadas, paradas de reacción, disciplina de dispersión, ráfagas tras una parada, un escuadrón en movimiento y el spider shot.\nUn calentamiento en orden y luego todos los ejercicios intercalados, para que cada partida pida una parada distinta.\n≈23 min; combínala con una rutina de flicks o de tracking en los días más largos."
"Warm-up: flick out and back home to the centre, no movement yet." = "Calentamiento: flick hacia afuera y de vuelta al centro, todavía sin movimiento."
"Warm-up: strafe, tap the opposite key, then shoot." = "Calentamiento: haz strafe, toca la tecla contraria y luego dispara."
"Warm-up: move, stop, shoot, and move again." = "Calentamiento: muévete, detente, dispara y vuelve a moverte."
"Stop sooner as the heads leave sooner; never shoot on the move to save time." = "Detente antes a medida que las cabezas se van antes; nunca dispares en movimiento para ahorrar tiempo."
"Watch the head, not your own keys: shoot when it settles." = "Mira la cabeza, no tus propias teclas: dispara cuando se asiente."
"Keep the crosshair at head height while you strafe." = "Mantén el crosshair a la altura de la cabeza mientras haces strafe."
"Brake W with S and S with W before you shoot." = "Frena W con S y S con W antes de disparar."
"Hold the head line and let the crouches come back to it." = "Mantén la línea de cabeza y deja que las agachadas vuelvan a ella."
"Stop the moment it appears, then shoot." = "Detente en cuanto aparezca y luego dispara."
"A full stop first: a moving shot cannot land here." = "Primero una parada completa: aquí un disparo en movimiento no puede acertar."
"Stop, two to four bullets, then strafe again." = "Detente, de dos a cuatro balas y vuelve a hacer strafe."
"Pick one target, stop, shoot, and move before the next." = "Elige un objetivo, detente, dispara y muévete antes del siguiente."
"Strafe between every shot and stop before you fire." = "Haz strafe entre cada disparo y detente antes de disparar."
"Pre-Match Warm-up (10 min)" = "Calentamiento previo (10 min)"
"Ten minutes before you queue. Covers every skill once and ends on movement so your counter-strafe is ready.\nIt is for warming up, not training: stop before you get tired." = "Diez minutos antes de buscar partida. Cubre cada habilidad una vez y termina con movimiento para que tu counter-strafe esté listo.\nEs para calentar, no para entrenar: detente antes de cansarte."
"Ranked Prep (≈13 min)" = "Preparación para ranked (≈13 min)"
"A short set before you queue ranked: one drill per skill, easiest first, ending on movement.\nTracking, clicking, switching, micros, head-level tracking, reflex flicks and counter-strafing, in order.\nIt is a warm-up, not training: play the early blocks easy and stop before you get tired." = "Una serie corta antes de buscar ranked: un ejercicio por habilidad, el más fácil primero, terminando con movimiento.\nTracking, clic, cambio de objetivo, micros, tracking a la altura de la cabeza, flicks reflejos y counter-strafe, en orden.\nEs un calentamiento, no un entrenamiento: juega los primeros bloques con calma y detente antes de cansarte."
"Easy: keep the crosshair glued to the sphere." = "Fácil: mantén el crosshair pegado a la esfera."
"Easy: land the crosshair on the sphere's center and stop there." = "Fácil: lleva el crosshair al centro de la esfera y detente ahí."
"Settle on the dot at once, leave the moment it dies." = "Asiéntate en el punto al instante y déjalo en cuanto muera."
"The crosshair settles on the sphere before every click." = "El crosshair se asienta en la esfera antes de cada clic."
"The crosshair stays on the head through each reversal." = "El crosshair se queda en la cabeza en cada cambio de dirección."
"Snap to the head and stop dead on it." = "Salta a la cabeza y detente en seco sobre ella."
"Stop moving, then click: you are ready to queue." = "Deja de moverte y luego haz clic: ya estás listo para buscar partida."
"Reaction and Decision (≈19 min)" = "Reacción y decisión (≈19 min)"
"Reacting and deciding under time pressure: reflex and reactive flicks, piling-up balloons, friend-or-foe clicks, peripheral and sound cues.\nA short warm-up in order, then every drill interleaved, so you never know which decision comes next.\nSound turn needs headphones. ≈19 min; add it after a skill routine or play it on its own." = "Reaccionar y decidir bajo presión de tiempo: flicks reflejos y reactivos, globos que se acumulan, clics de aliado o enemigo, señales periféricas y de sonido.\nUn calentamiento corto en orden y luego todos los ejercicios intercalados, para que nunca sepas qué decisión viene después.\nGiro al sonido necesita audífonos. ≈19 min; agrégala después de una rutina de habilidad o juégala sola."
"Hit the sphere before it vanishes." = "Acierta la esfera antes de que desaparezca."
"First click on the sphere, then follow it when it starts moving." = "Primer clic en la esfera y luego síguela cuando empiece a moverse."
"Clear the closest balloons before they pile up." = "Elimina los globos más cercanos antes de que se acumulen."
"Check the target's color first, then click only the foes." = "Revisa primero el color del objetivo y haz clic solo en los enemigos."
"Keep your eyes on the center; let the edge of the screen tell you." = "Mantén la vista en el centro; deja que el borde de la pantalla te avise."
"Remember where the targets were, then point there." = "Recuerda dónde estaban los objetivos y luego apunta ahí."
"Turn toward the sound before you see anything." = "Gira hacia el sonido antes de ver nada."
"Clicking II: Dynamic" = "Clic II: dinámico"
"Dynamic clicking day: moving heads, flicks to agents, and counter-strafe duels (VALORANT addition).\nVDIM-style day (structure from VDIM by Lowgravity56, 4rK and Voltaic): each block runs a related drill,\ntwo harder variants of a benchmark scenario, then the benchmark itself 4 times, played in order.\nLevels are relative to your tier; split the day into 2–3 sessions if it gets long." = "Día de clic dinámico: cabezas en movimiento, flicks a agentes y duelos de counter-strafe (añadido de VALORANT).\nDía al estilo VDIM (estructura de VDIM por Lowgravity56, 4rK y Voltaic): cada bloque juega un ejercicio relacionado, dos variantes más difíciles de un escenario del benchmark y luego el benchmark 4 veces, en orden.\nLos niveles son relativos a tu nivel; divide el día en 2–3 sesiones si se hace largo."
"Drill for dynamic-strafe-heads: build the technique, don't chase score." = "Ejercicio para dynamic-strafe-heads: construye la técnica, no persigas la puntuación."
"Variant: a bit harder than the benchmark." = "Variante: un poco más difícil que el benchmark."
"Hard variant: makes the benchmark feel easier." = "Variante difícil: hace que el benchmark se sienta más fácil."
"Benchmark: give your best runs." = "Benchmark: da tus mejores partidas."
"Drill for flick-headshot: build the technique, don't chase score." = "Ejercicio para flick-headshot: construye la técnica, no persigas la puntuación."
"Drill for counter-strafe: build the technique, don't chase score." = "Ejercicio para counter-strafe: construye la técnica, no persigas la puntuación."
"Clicking I: Static" = "Clic I: estático"
"Static clicking day: microcorrections and head-level precision.\nVDIM-style day (structure from VDIM by Lowgravity56, 4rK and Voltaic): each block runs a related drill,\ntwo harder variants of a benchmark scenario, then the benchmark itself 4 times, played in order.\nLevels are relative to your tier; split the day into 2–3 sessions if it gets long." = "Día de clic estático: microcorrecciones y precisión a la altura de la cabeza.\nDía al estilo VDIM (estructura de VDIM por Lowgravity56, 4rK y Voltaic): cada bloque juega un ejercicio relacionado, dos variantes más difíciles de un escenario del benchmark y luego el benchmark 4 veces, en orden.\nLos niveles son relativos a tu nivel; divide el día en 2–3 sesiones si se hace largo."
"Drill for micro-adjust: build the technique, don't chase score." = "Ejercicio para micro-adjust: construye la técnica, no persigas la puntuación."
"Drill for static-headline: build the technique, don't chase score." = "Ejercicio para static-headline: construye la técnica, no persigas la puntuación."
"Drill for long-range-heads: build the technique, don't chase score." = "Ejercicio para long-range-heads: construye la técnica, no persigas la puntuación."
"Switching II: Evasive" = "Cambio de objetivo II: evasivo"
"Evasive switching day: lock on to moving targets, kill and move on.\nVDIM-style day (structure from VDIM by Lowgravity56, 4rK and Voltaic): each block runs a related drill,\ntwo harder variants of a benchmark scenario, then the benchmark itself 4 times, played in order.\nLevels are relative to your tier; split the day into 2–3 sessions if it gets long." = "Día de cambio de objetivo evasivo: engánchate a objetivos en movimiento, elimínalos y sigue.\nDía al estilo VDIM (estructura de VDIM por Lowgravity56, 4rK y Voltaic): cada bloque juega un ejercicio relacionado, dos variantes más difíciles de un escenario del benchmark y luego el benchmark 4 veces, en orden.\nLos niveles son relativos a tu nivel; divide el día en 2–3 sesiones si se hace largo."
"Drill for switch-evasive: build the technique, don't chase score." = "Ejercicio para switch-evasive: construye la técnica, no persigas la puntuación."
"Drill for switch-evasive-small: build the technique, don't chase score." = "Ejercicio para switch-evasive-small: construye la técnica, no persigas la puntuación."
"Switching I: Speed" = "Cambio de objetivo I: velocidad"
"Speed switching day: fast, decisive switches between static targets and heads.\nVDIM-style day (structure from VDIM by Lowgravity56, 4rK and Voltaic): each block runs a related drill,\ntwo harder variants of a benchmark scenario, then the benchmark itself 4 times, played in order.\nLevels are relative to your tier; split the day into 2–3 sessions if it gets long." = "Día de cambio de objetivo rápido: cambios rápidos y decididos entre objetivos estáticos y cabezas.\nDía al estilo VDIM (estructura de VDIM por Lowgravity56, 4rK y Voltaic): cada bloque juega un ejercicio relacionado, dos variantes más difíciles de un escenario del benchmark y luego el benchmark 4 veces, en orden.\nLos niveles son relativos a tu nivel; divide el día en 2–3 sesiones si se hace largo."
"Drill for switch-speed: build the technique, don't chase score." = "Ejercicio para switch-speed: construye la técnica, no persigas la puntuación."
"Drill for switch-heads: build the technique, don't chase score." = "Ejercicio para switch-heads: construye la técnica, no persigas la puntuación."
"Drill for switch-wide: build the technique, don't chase score." = "Ejercicio para switch-wide: construye la técnica, no persigas la puntuación."
"Tracking I: Precise" = "Tracking I: preciso"
"Precise tracking day: smooth, predictable paths.\nVDIM-style day (structure from VDIM by Lowgravity56, 4rK and Voltaic): each block runs a related drill,\ntwo harder variants of a benchmark scenario, then the benchmark itself 4 times, played in order.\nLevels are relative to your tier; split the day into 2–3 sessions if it gets long." = "Día de tracking preciso: trayectorias suaves y predecibles.\nDía al estilo VDIM (estructura de VDIM por Lowgravity56, 4rK y Voltaic): cada bloque juega un ejercicio relacionado, dos variantes más difíciles de un escenario del benchmark y luego el benchmark 4 veces, en orden.\nLos niveles son relativos a tu nivel; divide el día en 2–3 sesiones si se hace largo."
"Drill for track-precise: build the technique, don't chase score." = "Ejercicio para track-precise: construye la técnica, no persigas la puntuación."
"Drill for track-orbit: build the technique, don't chase score." = "Ejercicio para track-orbit: construye la técnica, no persigas la puntuación."
"Tracking II: Reactive" = "Tracking II: reactivo"
"Reactive tracking day: sudden direction changes and close strafes.\nVDIM-style day (structure from VDIM by Lowgravity56, 4rK and Voltaic): each block runs a related drill,\ntwo harder variants of a benchmark scenario, then the benchmark itself 4 times, played in order.\nLevels are relative to your tier; split the day into 2–3 sessions if it gets long." = "Día de tracking reactivo: cambios de dirección repentinos y strafes cercanos.\nDía al estilo VDIM (estructura de VDIM por Lowgravity56, 4rK y Voltaic): cada bloque juega un ejercicio relacionado, dos variantes más difíciles de un escenario del benchmark y luego el benchmark 4 veces, en orden.\nLos niveles son relativos a tu nivel; divide el día en 2–3 sesiones si se hace largo."
"Drill for track-reactive-strafe: build the technique, don't chase score." = "Ejercicio para track-reactive-strafe: construye la técnica, no persigas la puntuación."
"Drill for track-reactive-micro: build the technique, don't chase score." = "Ejercicio para track-reactive-micro: construye la técnica, no persigas la puntuación."
"Drill for track-close-strafe: build the technique, don't chase score." = "Ejercicio para track-close-strafe: construye la técnica, no persigas la puntuación."
"Switching Builder (≈27 min)" = "Constructor de cambio de objetivo (≈27 min)"
"Builds target switching: static dots, steady movers, evasive jitter and flyers, low-gravity hops, ricochets and regenerating targets.\nBlocks run in order (no interleaving) while you learn the drills.\nEvery drill kills by holding fire on the target, so the skill is settling at once and leaving the moment it dies.\n≈27 min." = "Desarrolla el cambio de objetivo: puntos estáticos, móviles constantes, jitter evasivo y voladores, saltos con gravedad baja, rebotes y objetivos que se regeneran.\nLos bloques van en orden (sin intercalar) mientras aprendes los ejercicios.\nEn cada ejercicio se elimina manteniendo el disparo sobre el objetivo, así que la habilidad es asentarse al instante y dejarlo en cuanto muere.\n≈27 min."
"Match the movers' speed, switch on a steady rhythm." = "Iguala la velocidad de los móviles y cambia con un ritmo constante."
"Stay on the sphere through its quick reversals." = "Mantente en la esfera durante sus cambios de dirección rápidos."
"Keep the crosshair on the sphere as it comes closer or moves away." = "Mantén el crosshair en la esfera mientras se acerca o se aleja."
"Ride the arc, switch before the next one lands." = "Sigue el arco y cambia antes de que caiga el siguiente."
"Re-acquire the sphere right after it bounces off a wall." = "Recupera la esfera justo después de que rebote en una pared."
"Finish the kill before you switch, or the target heals." = "Termina la baja antes de cambiar, o el objetivo se cura."
"Tracking Builder (≈27 min)" = "Constructor de tracking (≈27 min)"
"Builds tracking from smooth to reactive: thin glides, 3D control and orbits first, then airborne, ground and fading targets.\nBlocks run in order (no interleaving) while you learn the drills; once they feel familiar, mix them into an interleaved routine.\n≈27 min. Play it on days you want to focus on tracking." = "Desarrolla el tracking de suave a reactivo: primero deslizamientos finos, control 3D y órbitas, luego objetivos en el aire, en el suelo y que se desvanecen.\nLos bloques van en orden (sin intercalar) mientras aprendes los ejercicios; cuando te resulten familiares, mézclalos en una rutina intercalada.\n≈27 min. Juégala los días en que quieras centrarte en el tracking."
"Smooth: match the capsule's speed, keep the crosshair on its middle." = "Suave: iguala la velocidad de la cápsula y mantén el crosshair en su centro."
"Smooth: the sphere grows and shrinks; the crosshair stays on its center." = "Suave: la esfera crece y encoge; el crosshair se queda en su centro."
"Smooth: move with the sphere around you, at its pace." = "Suave: muévete con la esfera a tu alrededor, a su ritmo."
"Reactive: follow each change of direction, don't predict it." = "Reactivo: sigue cada cambio de dirección, no lo predigas."
"Reactive: stay on the target through jukes and stops." = "Reactivo: mantente en el objetivo durante jukes y paradas."
"Reactive: get onto each new sphere at once and stay on it." = "Reactivo: ponte en cada nueva esfera al instante y quédate en ella."
"VALORANT Daily (≈37 min)" = "VALORANT diario (≈37 min)"
"Daily routine for VALORANT. A short warm-up in order, then interleaved blocks:\nhead-height clicking, strafing heads, counter-strafing, reactive micro-tracking and speed switching.\nInterleaving makes runs feel harder but improves retention (Shea & Morgan 1979).\n≈37 min stays inside the 30–50 min window where Listman et al. (2021) saw ~90% of daily gains.\nPlay it 5–6 days a week, and run the benchmark once a week instead of daily." = "Rutina diaria para VALORANT. Un calentamiento corto en orden y luego bloques intercalados: clic a la altura de la cabeza, cabezas con strafe, counter-strafe, micro tracking reactivo y cambio de objetivo rápido.\nIntercalar hace que las partidas se sientan más difíciles, pero mejora la retención (Shea & Morgan 1979).\n≈37 min queda dentro de la ventana de 30–50 min en la que Listman et al. (2021) vieron ~90% de las mejoras diarias.\nJuégala 5–6 días a la semana y haz el benchmark una vez a la semana en lugar de a diario."
"Warm-up: slow and smooth, don't chase score." = "Calentamiento: lento y suave, no persigas la puntuación."
"Warm-up: large targets, full arm." = "Calentamiento: objetivos grandes, todo el brazo."
"Keep the crosshair on the head line." = "Mantén el crosshair en la línea de cabeza."
"Small, calm corrections." = "Correcciones pequeñas y tranquilas."
"Read the strafe, tap the head." = "Lee el strafe y dispara a la cabeza."
"Stop first (counter-strafe), then shoot." = "Primero detente (counter-strafe) y luego dispara."
"React, don't predict." = "Reacciona, no predigas."
"Decisive switches, no hesitation." = "Cambios decididos, sin dudar."
"VALORANT Flick Tech (≈28 min)" = "Técnica de flick para VALORANT (≈28 min)"
"Flick technique for VALORANT: static pins, moving flyers, reflex snaps, shrinking targets and multi-phase flicks.\nA short warm-up in order, then one blocked pass of each drill, then the same drills interleaved.\nThe blocked pass lets you learn each drill; the interleaved half feels harder but retains better (Shea & Morgan 1979).\n≈28 min, near the 30–50 min window where Listman et al. (2021) saw most daily gains." = "Técnica de flick para VALORANT: pines estáticos, voladores en movimiento, saltos reflejos, objetivos que encogen y flicks en varias fases.\nUn calentamiento corto en orden, luego una pasada en bloque de cada ejercicio y después los mismos ejercicios intercalados.\nLa pasada en bloque te deja aprender cada ejercicio; la mitad intercalada se siente más difícil pero se retiene mejor (Shea & Morgan 1979).\n≈28 min, cerca de la ventana de 30–50 min en la que Listman et al. (2021) vieron la mayoría de las mejoras diarias."
"Learn it: click only once the crosshair rests on the pin." = "Apréndelo: haz clic solo cuando el crosshair repose en el pin."
"Learn it: aim where the flyer is going, not where it was." = "Apréndelo: apunta a donde va el volador, no a donde estaba."
"Learn it: snap to the head and stop dead on it." = "Apréndelo: salta a la cabeza y detente en seco sobre ella."
"Learn it: aim at the center; the target keeps getting smaller." = "Apréndelo: apunta al centro; el objetivo se sigue haciendo más pequeño."
"Learn it: watch the targets change and match the crosshair to them." = "Apréndelo: observa cómo cambian los objetivos y adapta el crosshair a ellos."
"Learn it: one path from crosshair to sphere, one click." = "Apréndelo: un recorrido del crosshair a la esfera, un clic."
"Mixed: every pin is a fresh landing spot." = "Mixto: cada pin es un nuevo punto de llegada."
"Mixed: read the flyer's path, then click on it." = "Mixto: lee la trayectoria del volador y luego hazle clic."
"Mixed: the dot lands on the head before the click." = "Mixto: el punto cae en la cabeza antes del clic."
"Mixed: small target, same calm click on its center." = "Mixto: objetivo pequeño, el mismo clic tranquilo en su centro."
"Mixed: match the crosshair to each phase's targets." = "Mixto: adapta el crosshair a los objetivos de cada fase."
"Mixed: hit the sphere before it vanishes." = "Mixto: acierta la esfera antes de que desaparezca."
"VALORANT Micros (≈23 min)" = "Micros para VALORANT (≈23 min)"
"Small, exact corrections for VALORANT: tight clusters, accuracy-weighted micros, angle holds and close pairs.\nA warm-up in order, one blocked pass of each new drill, then all of them interleaved with reactive micro-tracking.\nAccuracy matters more than speed here: a micro that overshoots is a lost duel.\n≈23 min; pair it with a flick or tracking routine on longer days." = "Correcciones pequeñas y exactas para VALORANT: grupos cerrados, micros ponderados por precisión, mantener ángulos y pares cercanos.\nUn calentamiento en orden, una pasada en bloque de cada ejercicio nuevo y luego todos intercalados con micro tracking reactivo.\nAquí la precisión importa más que la velocidad: un micro que se pasa es un duelo perdido.\n≈23 min; combínala con una rutina de flicks o de tracking en los días más largos."
"Warm-up: nudge the crosshair onto the target, no further." = "Calentamiento: lleva el crosshair justo al objetivo, sin pasarte."
"Learn it: move the crosshair the short gap to the next sphere, then click." = "Apréndelo: mueve el crosshair la corta distancia hasta la siguiente esfera y luego haz clic."
"Learn it: the crosshair settles on the sphere before every click." = "Apréndelo: el crosshair se asienta en la esfera antes de cada clic."
"Learn it: keep the crosshair on the head line where the target appears." = "Apréndelo: mantén el crosshair en la línea de cabeza donde aparece el objetivo."
"Learn it: short hop from one sphere to the other, land, then click." = "Apréndelo: salto corto de una esfera a la otra, llega y luego haz clic."
"Mixed: small hops between close spheres." = "Mixto: saltos pequeños entre esferas cercanas."
"Mixed: a hit on the sphere is worth more than a fast miss." = "Mixto: un acierto en la esfera vale más que un fallo rápido."
"Mixed: the crosshair waits on the head line; the target walks into it." = "Mixto: el crosshair espera en la línea de cabeza; el objetivo entra en él."
"Mixed: land on the sphere, then click." = "Mixto: llega a la esfera y luego haz clic."
"Mixed: keep the crosshair on the sphere as it changes direction." = "Mixto: mantén el crosshair en la esfera mientras cambia de dirección."
"VALORANT Stability (≈28 min)" = "Estabilidad para VALORANT (≈28 min)"
"Staying on the head through strafes and peeks, plus the counter-strafe that makes your own shots accurate.\nA warm-up in order, one blocked pass of each drill, then the drills interleaved.\n≈28 min, near the 30–50 min window where Listman et al. (2021) saw most daily gains." = "Mantenerse en la cabeza durante strafes y peeks, más el counter-strafe que hace precisos tus propios disparos.\nUn calentamiento en orden, una pasada en bloque de cada ejercicio y luego los ejercicios intercalados.\n≈28 min, cerca de la ventana de 30–50 min en la que Listman et al. (2021) vieron la mayoría de las mejoras diarias."
"Warm-up: bring the crosshair to a stop, then shoot." = "Calentamiento: detén el crosshair y luego dispara."
"Learn it: the crosshair stays on the head through each reversal." = "Apréndelo: el crosshair se queda en la cabeza en cada cambio de dirección."
"Learn it: catch the peeker and ride it until it leaves." = "Apréndelo: atrapa al peeker y síguelo hasta que se vaya."
"Learn it: after each dart, one clean move back onto the sphere." = "Apréndelo: tras cada salto, un movimiento limpio de vuelta a la esfera."
"Learn it: follow the target's jukes, don't guess them." = "Apréndelo: sigue los jukes del objetivo, no los adivines."
"Learn it: the shot goes off the moment you are still." = "Apréndelo: el disparo sale en el momento en que estás quieto."
"Mixed: the crosshair stays on the head, not the body." = "Mixto: el crosshair se queda en la cabeza, no en el cuerpo."
"Mixed: be on the target the moment it appears." = "Mixto: estate en el objetivo en cuanto aparezca."
"Mixed: one smooth correction per dart." = "Mixto: una corrección suave por cada salto."
"Mixed: react to the target's change of direction." = "Mixto: reacciona al cambio de dirección del objetivo."
"Mixed: stop moving, then click." = "Mixto: deja de moverte y luego haz clic."
"Mixed: stop, shoot, move again." = "Mixto: detente, dispara y vuelve a moverte."

# Benchmark (content/benchmarks)
"VALORANT Benchmark" = "Benchmark de VALORANT"
"Measures every aim skill VALORANT asks of you. It uses Voltaic's structure: skill → subcategory → scenarios.\nYour best scenario sets each subcategory's energy, and the overall energy is the harmonic mean, so your weakest skill counts most.\nPROVISIONAL: thresholds come from the simulated aimer profiles (Fitts' law model), not from real players.\nRun it once a week, not daily.\nThree tiers play the same scenarios at different difficulty levels (novice −0.5, intermediate as authored, advanced +0.5), each with its own thresholds; pick the tier that matches your training tier." = "Mide cada habilidad de puntería que VALORANT te pide. Usa la estructura de Voltaic: habilidad → subcategoría → escenarios.\nTu mejor escenario fija la energía de cada subcategoría, y la energía total es la media armónica, así que tu habilidad más débil es la que más cuenta.\nPROVISIONAL: los umbrales vienen de los perfiles de jugador simulado (modelo de la ley de Fitts), no de jugadores reales.\nHazlo una vez a la semana, no a diario.\nTres niveles juegan los mismos escenarios con distintas dificultades (novato −0.5, intermedio tal como está, avanzado +0.5), cada uno con sus propios umbrales; elige el nivel que coincida con tu nivel de entrenamiento."
"Recruit" = "Recluta"
"Contender" = "Contendiente"
"Veteran" = "Veterano"
"Elite" = "Élite"
"Novice" = "Novato"
"Intermediate" = "Intermedio"
"Advanced" = "Avanzado"
