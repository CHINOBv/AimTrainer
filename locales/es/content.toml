# Arenas (content/arenas)
"Angles Lab Clear" = "Angles Lab: limpieza"
"Clear the doorway, close corner, off-angle, box and long angle in order. Pre-aim where the head appears: the crosshair placement error at first sight is measured." = "Limpia en orden la puerta, la esquina cercana, el off-angle, la caja y el ángulo largo. Apunta de antemano a donde aparece la cabeza: se mide el error de colocación del crosshair al primer contacto visual."
"Angles Lab Pre-aim" = "Angles Lab: pre-aim"
"Clear the five marked angles against fast bots. Each enemy first seen within 5 degrees of the crosshair counts as pre-aimed and scores extra; the results show the head-level error." = "Limpia los cinco ángulos marcados contra bots rápidos. Cada enemigo visto por primera vez a menos de 5 grados del crosshair cuenta como pre-aim y puntúa extra; los resultados muestran el error a la altura de la cabeza."
"Corridor Duels" = "Duelos en el pasillo"
"Two veteran bots roam the Duel Corridor and its pockets. Win the duels at 15-25 m." = "Dos bots veteranos recorren el Pasillo de duelos y sus huecos laterales. Gana los duelos a 15-25 m."
"Corridor Jiggle Peeks" = "Jiggle peeks en el pasillo"
"Enemies jiggle-peek the two pocket corners, visible for a fraction of a second at a time. Hold the angle at head level and shoot inside the window." = "Los enemigos hacen jiggle peek en las dos esquinas de los huecos laterales, visibles una fracción de segundo cada vez. Mantén el ángulo a la altura de la cabeza y dispara dentro de la ventana."
"Duel Ladder" = "Escalera de duelos"
"Two bots duel you down the corridor. Three kills in a row make them sharper, two deaths in a row ease them off, from recruit up to elite. Climb as high as you can and stay there." = "Dos bots te retan a duelo a lo largo del pasillo. Tres bajas seguidas los hacen más hábiles y dos muertes seguidas los suavizan, de recluta a élite. Sube lo más alto que puedas y mantente ahí."
"Reactive Duels" = "Duelos reactivos"
"Two bots hold long angles, strafe when hit and fall back under half health. They copy or fight your strafe and juke when your crosshair gets close or you fire. Kill each bot within 1.5 s of seeing it, or it lands a shot." = "Dos bots mantienen ángulos largos, hacen strafe al recibir un impacto y retroceden con menos de la mitad de vida. Copian o contrarrestan tu strafe y hacen jukes cuando tu crosshair se acerca o disparas. Elimina a cada bot dentro de 1.5 s de verlo, o te acertará un disparo."
"Lanes Deathmatch" = "Deathmatch en los carriles"
"Three contender bots roam the Freight Lanes, strafe when they fight and fall back to cover when shot. Clear the lanes crate by crate and catch them on the re-peek." = "Tres bots contendientes recorren los Carriles de carga, hacen strafe al pelear y vuelven a cubrirse al recibir disparos. Limpia los carriles caja por caja y atrápalos en el re-peek."
"Outpost Site Hold" = "Defensa del sitio en el puesto"
"Six attackers push the site from two lanes, two at a time, and strafe when they fight. Kill them all or keep them off the site until time runs out; an attacker that stands on the site for 3 s captures it and ends the run." = "Seis atacantes empujan el sitio desde dos carriles, de dos en dos, y hacen strafe al pelear. Elimínalos a todos o mantenlos fuera del sitio hasta que se acabe el tiempo; un atacante que se queda 3 s en el sitio lo captura y termina la partida."
"Yard Deathmatch" = "Deathmatch en el patio"
"Four contender bots roam the Training Yard and fight back. Hold head level, clear cover and take first-shot duels." = "Cuatro bots contendientes recorren el Patio de entrenamiento y responden al fuego. Mantén la altura de la cabeza, limpia las coberturas y gana los duelos de primer disparo."
"Yard Squad" = "Escuadrón del patio"
"Five bots with different personalities: two roamers, a veteran pusher that hunts you down, an angle holder that never leaves its spot and a jiggle peeker that strafes every fight. Read who you are fighting and change your peek." = "Cinco bots con personalidades distintas: dos que deambulan, un veterano agresivo que te persigue, uno que mantiene un ángulo y nunca deja su sitio y uno que hace jiggle peek y strafe en cada pelea. Lee contra quién peleas y cambia tu peek."

