"Reactive tracking" = "Tracking reactivo"
"Speed switching" = "Cambio de objetivo rápido"
"Evasive switching" = "Cambio de objetivo evasivo"
"Movement accuracy" = "Precisión en movimiento"
"Angle holding" = "Mantener ángulos"

# Training method (content/methods)
"Weekly Skill Plan" = "Plan semanal de habilidades"
"One skill per day, Monday to Saturday, with a flexible Sunday. Each day builds from drills and\nharder variants up to the day's benchmark scenarios, so progress is measured while you train and\nno separate benchmark day is needed. About 30–40 min a day." = "Una habilidad por día, de lunes a sábado, con un domingo flexible. Cada día avanza desde ejercicios y variantes más difíciles hasta los escenarios del benchmark del día, así que el progreso se mide mientras entrenas y no hace falta un día aparte de benchmark. Unos 30–40 min al día."
"Structure adapted from VDIM (Voltaic Daily Improvement Method) by Lowgravity56 and 4rK, published by Voltaic. Scenarios are original." = "Estructura adaptada de VDIM (Voltaic Daily Improvement Method) de Lowgravity56 y 4rK, publicado por Voltaic. Los escenarios son originales."

