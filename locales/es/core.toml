# Findings (analytics::profile::Finding::explanation_in)
"{metric} {value} is above the {threshold} threshold: {meaning}." = "{metric} {value} está por encima del umbral de {threshold}: {meaning}."
"{metric} {value} is below the {threshold} threshold: {meaning}." = "{metric} {value} está por debajo del umbral de {threshold}: {meaning}."

# Benchmark subcategory standing (analytics::skills::BenchmarkProfile::explanation_in)
"{name}: not played yet." = "{name}: aún sin jugar."
"{name}: {energy} energy. Play at least {min} subcategories to compare them." = "{name}: {energy} de energía. Juega al menos {min} subcategorías para compararlas."
"{name}: {energy} energy is {share}% below your average of {average} across {played} played subcategories." = "{name}: {energy} de energía está {share}% por debajo de tu promedio de {average} en {played} subcategorías jugadas."
"{name}: {energy} energy is {share}% above your average of {average} across {played} played subcategories." = "{name}: {energy} de energía está {share}% por encima de tu promedio de {average} en {played} subcategorías jugadas."

# Mistakes (analytics::mistakes)
"Extra corrections" = "Correcciones de más"
"Slow reaction" = "Reacción lenta"
"Late click" = "Clic tardío"
"this {deg}° flick right" = "este flick de {deg}° a la derecha"
"this {deg}° flick up-right" = "este flick de {deg}° arriba a la derecha"
"this {deg}° flick up" = "este flick de {deg}° hacia arriba"
"this {deg}° flick up-left" = "este flick de {deg}° arriba a la izquierda"
"this {deg}° flick left" = "este flick de {deg}° a la izquierda"
"this {deg}° flick down-left" = "este flick de {deg}° abajo a la izquierda"
"this {deg}° flick down" = "este flick de {deg}° hacia abajo"
"this {deg}° flick down-right" = "este flick de {deg}° abajo a la derecha"
"1 correction" = "1 corrección"
"{n} corrections" = "{n} correcciones"
", then needed 1 correction to come back" = ", y luego necesitaste 1 corrección para volver"
", then needed {n} corrections to come back" = ", y luego necesitaste {n} correcciones para volver"
"Overflick: on {flick} your first movement ended {radii} target radii past the center, {edge}° beyond the far edge{back}. Start braking earlier: aim to stop on the near half of the target and let one small correction finish the shot. If most of your flicks overshoot, try a slightly lower sensitivity." = "Overflick: en {flick} tu primer movimiento terminó {radii} radios de objetivo más allá del centro, {edge}° después del borde lejano{back}. Empieza a frenar antes: busca detenerte en la mitad cercana del objetivo y deja que una pequeña corrección termine el disparo. Si la mayoría de tus flicks se pasan, prueba una sensibilidad un poco más baja."
"Underflick: on {flick} your first movement stopped {radii} target radii short of the center, {edge}° before the near edge{back}. Commit to the full distance: move through to the target in one motion instead of creeping up on it." = "Underflick: en {flick} tu primer movimiento se detuvo {radii} radios de objetivo antes del centro, {edge}° antes del borde cercano{back}. Recorre la distancia completa: llega al objetivo en un solo movimiento en lugar de acercarte poco a poco."
"Extra corrections: on {flick} you needed {corrections} after the first movement (more than {limit} is a lot). Make the first movement land on the target: slow its end slightly and keep it to one small correction at most." = "Correcciones de más: en {flick} necesitaste {corrections} después del primer movimiento (más de {limit} es mucho). Haz que el primer movimiento caiga en el objetivo: frena un poco su final y limítalo a una pequeña corrección como máximo."
"Slow reaction: you started {flick} {ms} ms after the target appeared (more than {limit} ms is slow). Keep your crosshair at head height and your grip relaxed, and start moving the moment you see the target; small errors can be corrected." = "Reacción lenta: empezaste {flick} {ms} ms después de que apareció el objetivo (más de {limit} ms es lento). Mantén el crosshair a la altura de la cabeza y el agarre relajado, y empieza a moverte en cuanto veas el objetivo; los errores pequeños se pueden corregir."
"Late click: on {flick} your crosshair was on the target for {ms} ms before you clicked (more than {limit} ms is hesitation). Click as soon as the crosshair reaches the target; trust the flick instead of checking it." = "Clic tardío: en {flick} tu crosshair estuvo sobre el objetivo {ms} ms antes de que hicieras clic (más de {limit} ms es dudar). Haz clic en cuanto el crosshair llegue al objetivo; confía en el flick en lugar de comprobarlo."

