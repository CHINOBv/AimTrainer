"if half of your {n} misses had hit the first time" = "si la mitad de tus {n} fallos hubieran acertado a la primera"
"if your {n} slow clicks came within {ms} ms of reaching the target" = "si tus {n} clics lentos hubieran llegado dentro de {ms} ms tras alcanzar el objetivo"

