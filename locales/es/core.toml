"Corrections per flick" = "Correcciones por flick"
"Path efficiency" = "Eficiencia de trayectoria"
"Time on target" = "Tiempo en el objetivo"
"Time behind the target" = "Tiempo detrás del objetivo"
"Reaction to direction changes" = "Reacción a cambios de dirección"
"Speed match" = "Igualación de velocidad"
"Time on the target's edge" = "Tiempo en el borde del objetivo"
"Shots fired while moving" = "Disparos en movimiento"
"Opening pace (vs rest of run)" = "Ritmo inicial (vs resto de la partida)"
"Late pace (vs early run)" = "Ritmo final (vs inicio de la partida)"
"Nearest target first" = "Objetivo más cercano primero"
"Missed opportunities" = "Oportunidades perdidas"
"Median click delay" = "Retraso de clic mediano"
"Hit-rate gap of your weakest flick direction" = "Brecha de acierto de tu dirección de flick más débil"
