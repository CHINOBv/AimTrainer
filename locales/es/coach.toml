# Spanish UI text for the "coach" area. Keys are the exact English source text.
# See docs/i18n.md before editing.
# Only the Coach tab chrome: the chat, prompts and tool output sent to models stay English.

# Header and opt-in
"AI coach" = "Coach de IA"
"Enable the AI coach (sends your stats summary and the chat to the provider you pick)" = "Activar el coach de IA (envía el resumen de tus estadísticas y el chat al proveedor que elijas)"
