# Spanish UI text for the "rules" area. Keys are the exact English source text.
# See docs/i18n.md before editing.

"you start moving late after a target appears" = "empiezas a moverte tarde cuando aparece un objetivo"
"Keep the crosshair where targets appear and react to the first pixel, not the whole target." = "Mantén el crosshair donde aparecen los objetivos y reacciona al primer píxel, no al objetivo completo."
"you start moving quickly after a target appears" = "empiezas a moverte rápido cuando aparece un objetivo"
"your first movement often ends past the target's far edge" = "tu primer movimiento suele terminar más allá del borde lejano del objetivo"
"Slow your flicks slightly and aim to land on the target in one motion; if it persists, check that your sensitivity matches VALORANT." = "Haz tus flicks un poco más lentos y busca caer en el objetivo en un solo movimiento; si persiste, revisa que tu sensibilidad coincida con VALORANT."
"your first movement often stops short of the target" = "tu primer movimiento suele quedarse corto antes del objetivo"
"Commit to the full distance with your arm instead of finishing the flick with small wrist corrections." = "Recorre la distancia completa con el brazo en lugar de terminar el flick con pequeñas correcciones de muñeca."
"you usually need more than one correction after the first movement" = "sueles necesitar más de una corrección después del primer movimiento"
"Make the first movement more accurate rather than faster; corrections cost more time than a slightly slower flick." = "Haz el primer movimiento más preciso en lugar de más rápido; las correcciones cuestan más tiempo que un flick un poco más lento."
"your crosshair travels a curved or back-and-forth path to the target" = "tu crosshair hace un recorrido curvo o de ida y vuelta hasta el objetivo"
"Move in a straight line to the target; keep head height so flicks stay horizontal." = "Muévete en línea recta hacia el objetivo; mantén la altura de la cabeza para que los flicks sean horizontales."
"your first movement rarely ends past the target" = "tu primer movimiento rara vez termina más allá del objetivo"
"you are off the target for more than half the time you fire" = "estás fuera del objetivo más de la mitad del tiempo que disparas"
"Prioritize smooth, steady mouse movement over chasing the target; speed up only once you stay on it." = "Prioriza un movimiento de mouse suave y constante en lugar de perseguir al objetivo; acelera solo cuando ya te mantengas encima."
"you stay on the target most of the time you fire" = "te mantienes en el objetivo la mayor parte del tiempo que disparas"
"you trail behind moving targets most of the time" = "vas detrás de los objetivos en movimiento la mayor parte del tiempo"
"Match the target's speed first, then close the gap; watch the target, not the crosshair." = "Primero iguala la velocidad del objetivo y luego cierra la distancia; mira al objetivo, no al crosshair."
"you run ahead of moving targets most of the time" = "te adelantas a los objetivos en movimiento la mayor parte del tiempo"
"Stop predicting; follow the target and let it lead you." = "Deja de anticiparte; sigue al objetivo y deja que él te guíe."
"you take long to follow a target that changes direction" = "tardas en seguir a un objetivo que cambia de dirección"
"React to strafes instead of anticipating them; relax your grip so reversals are quicker." = "Reacciona a los strafes en lugar de anticiparlos; relaja el agarre para que los cambios de dirección sean más rápidos."
"your crosshair speed rarely matches the target's speed" = "la velocidad de tu crosshair rara vez coincide con la del objetivo"
"Match the target's speed before correcting your position; the too slow / too fast split shows which way you miss." = "Iguala la velocidad del objetivo antes de corregir tu posición; la división demasiado lento / demasiado rápido muestra hacia dónde fallas."
"you ride the edge of the target instead of its center" = "te quedas en el borde del objetivo en lugar de su centro"
"Once you are on the target, steer back to its center instead of staying at the edge." = "Cuando estés en el objetivo, vuelve a su centro en lugar de quedarte en el borde."
"you often fire before you have stopped" = "sueles disparar antes de haberte detenido"
"Tap the opposite strafe key (or release the keys) and fire only once you have stopped; shots are accurate again at 27.5% of run speed or less." = "Toca la tecla de strafe contraria (o suelta las teclas) y dispara solo cuando te hayas detenido; los disparos vuelven a ser precisos al 27.5% de la velocidad de carrera o menos."
"you score much slower at the start of a run than in the rest of it" = "puntúas mucho más lento al inicio de una partida que en el resto"
"Warm up before scored runs so the first seconds count; the quick warm-up routine gets you to full speed." = "Calienta antes de las partidas puntuadas para que los primeros segundos cuenten; la rutina de calentamiento rápido te pone a máxima velocidad."
"your scoring rate drops in the last third of the run" = "tu ritmo de puntuación baja en el último tercio de la partida"
"Keep a relaxed grip and steady breathing to the end; build endurance with longer sessions and short breaks between runs." = "Mantén un agarre relajado y una respiración constante hasta el final; gana resistencia con sesiones más largas y pausas cortas entre partidas."
"you often go for a farther target while a nearer one is available" = "sueles ir por un objetivo más lejano cuando hay uno más cercano disponible"
"Clear the target closest to your crosshair first: the shorter flick is faster and keeps the others in view." = "Elimina primero el objetivo más cercano a tu crosshair: el flick más corto es más rápido y mantiene a los demás a la vista."
"you clear the nearest target first" = "eliminas primero el objetivo más cercano"
"your crosshair rests on targets that you then leave without firing" = "tu crosshair se posa en objetivos que luego dejas sin disparar"
"Fire as soon as the crosshair is on the target; trust it instead of waiting for a perfect picture." = "Dispara en cuanto el crosshair esté en el objetivo; confía en él en lugar de esperar una imagen perfecta."
"you hesitate on the target before clicking" = "dudas sobre el objetivo antes de hacer clic"
"Click as soon as the crosshair reaches the target; trust the first placement instead of confirming it." = "Haz clic en cuanto el crosshair llegue al objetivo; confía en la primera colocación en lugar de confirmarla."
"your flicks in one direction hit far less often than the rest" = "tus flicks en una dirección aciertan mucho menos que el resto"
"Give extra reps to the direction the flick grid marks weakest, and slow down there until its hit rate catches up." = "Dale repeticiones extra a la dirección que la cuadrícula de flicks marca como la más débil, y baja la velocidad ahí hasta que su tasa de acierto se iguale."
"most of your misses land below the head or target center, so your crosshair sits too low" = "la mayoría de tus fallos caen por debajo de la cabeza o del centro del objetivo, así que tu crosshair está demasiado bajo"
"Keep the crosshair at head height while you wait and between targets, and finish each flick at the top half of the head." = "Mantén el crosshair a la altura de la cabeza mientras esperas y entre objetivos, y termina cada flick en la mitad superior de la cabeza."
"most of your misses land above the head or target center, so your flicks pull up past it" = "la mayoría de tus fallos caen por encima de la cabeza o del centro del objetivo, así que tus flicks suben de más"
"Flick level with the head instead of pulling up through it, and let the vertical part of the movement stop on the target." = "Haz el flick a la altura de la cabeza en lugar de subir a través de ella, y deja que la parte vertical del movimiento se detenga en el objetivo."
