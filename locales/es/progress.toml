# Sensitivity suggestion
"{}% past the target" = "{}% más allá del objetivo"
"{}% short of the target" = "{}% antes del objetivo"
"{name}: first movements end {bias} on average ({samples} flicks) → ×{multiplier}" = "{name}: los primeros movimientos terminan en promedio {bias} ({samples} flicks) → ×{multiplier}"
"{name}: fewer than {min} measured flicks" = "{name}: menos de {min} flicks medidos"
"Horizontal" = "Horizontal"
"Vertical" = "Vertical"
"Sensitivity suggestion" = "Sugerencia de sensibilidad"
"From where your first movement ends in your last {} click runs: consistent overshoot suggests a lower sensitivity, undershoot a higher one. Nothing changes unless you apply it. Complements the sensitivity finder in Tools." = "Según dónde termina tu primer movimiento en tus últimas {} partidas de clic: un overflick constante sugiere una sensibilidad más baja y un underflick, una más alta. Nada cambia a menos que la apliques. Complementa al buscador de sensibilidad de Herramientas."
"Not enough data yet: needs {min} measured flicks ({runs} click runs analyzed)." = "Aún no hay datos suficientes: se necesitan {min} flicks medidos ({runs} partidas de clic analizadas)."
"Overall: first movements end {} on average ({} flicks from {} runs)." = "En general: los primeros movimientos terminan en promedio {} ({} flicks de {} partidas)."
"{} (information only: mouse look uses one sensitivity for both axes)" = "{} (solo informativo: la cámara usa una sola sensibilidad para ambos ejes)"
"Multipliers are clamped to ×{low}–×{high}; within ±{band}% means no change. Thresholds are provisional." = "Los multiplicadores se limitan a ×{low}–×{high}; dentro de ±{band}% significa sin cambio. Los umbrales son provisionales."
"No change needed (×{})." = "No hace falta cambiar nada (×{})."
"Applied: ×{multiplier} = {cm} cm/360 ({game} {value} at {dpi} DPI)" = "Aplicada: ×{multiplier} = {cm} cm/360 ({game} {value} a {dpi} DPI)"
"Suggested: ×{multiplier} = {cm} cm/360 ({game} {value} at {dpi} DPI)" = "Sugerida: ×{multiplier} = {cm} cm/360 ({game} {value} a {dpi} DPI)"
"Play a few click runs before trusting a new suggestion." = "Juega algunas partidas de clic antes de fiarte de una nueva sugerencia."
"Apply overall multiplier" = "Aplicar multiplicador global"

# Break reminder
"Break time: {minutes} min of continuous play. Take about {break_minutes} min away from the mouse." = "Hora del descanso: {minutes} min de juego continuo. Aléjate del mouse unos {break_minutes} min."
"{minutes} min of aim training in the last 7 days, at or above your weekly cap of {cap} min. More volume this week adds little; consider lighter days." = "{minutes} min de entrenamiento de aim en los últimos 7 días, igual o por encima de tu límite semanal de {cap} min. Más volumen esta semana aporta poco; considera días más ligeros."
"Break reminder" = "Recordatorio de descanso"
"Stretches" = "Estiramientos"
"General stretches, not medical advice. Move gently and stop if anything hurts. See a health professional about pain that lasts." = "Estiramientos generales, no consejo médico. Muévete con suavidad y detente si algo duele. Consulta a un profesional de la salud si el dolor persiste."
"Wrist, neck and back complaints are common among esports players, but no trial has shown that breaks or stretches prevent them. Breaks are offered as a precaution; you can change or turn them off in Settings." = "Las molestias de muñeca, cuello y espalda son comunes entre jugadores de esports, pero ningún ensayo ha demostrado que los descansos o estiramientos las prevengan. Los descansos se ofrecen como precaución; puedes cambiarlos o desactivarlos en Ajustes."
"Wrist flexor stretch" = "Estiramiento de flexores de muñeca"
"Arm straight, palm up; gently pull the fingers back with the other hand." = "Brazo estirado, palma hacia arriba; tira suavemente de los dedos hacia atrás con la otra mano."
"Wrist extensor stretch" = "Estiramiento de extensores de muñeca"
"Arm straight, palm down; gently bend the hand down with the other hand." = "Brazo estirado, palma hacia abajo; dobla suavemente la mano hacia abajo con la otra mano."
"Finger spreads" = "Separación de dedos"
"Spread the fingers wide, hold, then make a loose fist. Repeat." = "Separa bien los dedos, mantén y luego cierra el puño sin apretar. Repite."
"Shoulder rolls" = "Rotación de hombros"
"Roll both shoulders slowly backwards, then forwards." = "Gira ambos hombros lentamente hacia atrás y luego hacia adelante."
"Look away" = "Mira a lo lejos"
"Stand up and look at something far away to rest the eyes." = "Ponte de pie y mira algo lejano para descansar la vista."
"Dismiss" = "Descartar"
"Snooze {} min" = "Posponer {} min"
"Dismiss weekly note" = "Descartar aviso semanal"
