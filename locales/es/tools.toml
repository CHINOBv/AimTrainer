# Sensitivity finder (sens_finder.rs).
"Find my sensitivity" = "Encontrar mi sensibilidad"
"Plays short wide-switching tests at a faster and a slower sensitivity, keeps the one you score better with, and narrows the gap each round. Scores are noisy: run it twice and trust a result that repeats. Tests do not count toward your history." = "Juega pruebas cortas de cambio amplio de objetivo con una sensibilidad más rápida y otra más lenta, se queda con la que mejor puntúas y acorta la diferencia en cada ronda. Las puntuaciones varían: hazlo dos veces y confía en un resultado que se repita. Las pruebas no cuentan en tu historial."
"▶ Start from your current {} cm/360" = "▶ Empezar desde tus {} cm/360 actuales"
"Round" = "Ronda"
"Fast" = "Rápida"
"Slow" = "Lenta"
"Round {}/{}" = "Ronda {}/{}"
"▶ Test the faster sensitivity ({} cm/360)" = "▶ Probar la sensibilidad más rápida ({} cm/360)"
"▶ Test the slower sensitivity ({} cm/360)" = "▶ Probar la sensibilidad más lenta ({} cm/360)"
"Best for you: {cm} cm/360 = {game} {value} at {dpi} DPI" = "La mejor para ti: {cm} cm/360 = {game} {value} a {dpi} DPI"
"Apply as my sensitivity" = "Aplicar como mi sensibilidad"
"Change your in-game sensitivity to match before playing ranked." = "Cambia tu sensibilidad en el juego para que coincida antes de jugar competitivo."
"Reset finder" = "Reiniciar buscador"

# DPI check (dpi_check.rs).
"Real DPI ≈ {real} (set to {set}): {deviation}% deviation" = "DPI real ≈ {real} (configurado en {set}): {deviation}% de desviación"
"1. Lay a ruler next to the mouse.  2. Press Start.  3. Hold {key}, move the mouse the distance below to the right along the ruler, then release {key}." = "1. Pon una regla junto al mouse.  2. Pulsa Empezar.  3. Mantén {key}, mueve el mouse hacia la derecha a lo largo de la regla la distancia indicada abajo y suelta {key}."
"Distance moved" = "Distancia recorrida"
"Stop" = "Detener"
"Start" = "Empezar"
"Counting… {} counts" = "Contando… {} cuentas"
"Hold {key} and move. Last count: {count}" = "Mantén {key} y muévete. Última cuenta: {count}"
"Expect a match within a few %. A large mismatch means a wrong DPI value or OS acceleration." = "Lo normal es que coincida con unos pocos % de diferencia. Una gran diferencia indica un valor de DPI incorrecto o aceleración del sistema."
"Apply corrected sensitivity…" = "Aplicar la sensibilidad corregida…"
"Stores the real DPI and scales the sensitivity so your cm/360 stays the same." = "Guarda el DPI real y ajusta la sensibilidad para que tu cm/360 no cambie."
"Change to {value} @ {dpi} DPI (keeps {cm} cm/360)? Set the same sensitivity in VALORANT, or the trainer will no longer match the game." = "¿Cambiar a {value} @ {dpi} DPI (mantiene {cm} cm/360)? Pon la misma sensibilidad en VALORANT o el entrenador dejará de coincidir con el juego."
"Apply" = "Aplicar"
"Cancel" = "Cancelar"

# System check (system_check.rs).
"System check" = "Revisión del sistema"
"{fps} FPS average · {low} FPS 1% low · {ms} ms per frame" = "{fps} FPS de media · {low} FPS en el 1% más bajo · {ms} ms por fotograma"
"1% lows under your monitor's refresh rate add visible stutter; close background apps or lower the window size." = "Un 1% más bajo por debajo de la frecuencia de tu monitor provoca tirones visibles; cierra las aplicaciones en segundo plano o reduce el tamaño de la ventana."
"Measuring frame times…" = "Midiendo los tiempos de fotograma…"
"Vsync off (uncapped frames, lowest input latency)" = "Vsync desactivado (fotogramas sin límite, mínima latencia de entrada)"
"Borderless fullscreen (consistent frame pacing)" = "Pantalla completa sin bordes (ritmo de fotogramas constante)"
"Mouse input is read raw (unaccelerated counts); confirm with the DPI check above." = "La entrada del mouse se lee en bruto (cuentas sin aceleración); confírmalo con la prueba de DPI de arriba."
"Windows: turn off \"Enhance pointer precision\" for the desktop; the trainer and VALORANT use raw input either way." = "Windows: desactiva \"Mejorar la precisión del puntero\" para el escritorio; el entrenador y VALORANT usan entrada en bruto de todos modos."
"Wayland: raw counts come from the relative-pointer protocol, unaffected by compositor acceleration." = "Wayland: las cuentas en bruto vienen del protocolo de puntero relativo, sin verse afectadas por la aceleración del compositor."

