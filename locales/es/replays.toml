# Mistake player
"No mistakes to replay in this run: every flick was clean. Hold runs are not covered." = "No hay errores que repetir en esta partida: todos los flicks fueron limpios. Las partidas de mantener no se incluyen."
"Step through this run's mistakes" = "Repasar los errores de esta partida"
"Close" = "Cerrar"
"◀ Previous mistake" = "◀ Error anterior"
"Next mistake ▶" = "Siguiente error ▶"
"◀ Back" = "◀ Atrás"
"Next ▶" = "Siguiente ▶"
"▶ Play" = "▶ Reproducir"
"⏸ Pause" = "⏸ Pausa"
"⟲ Restart" = "⟲ Reiniciar"
"Speed:" = "Velocidad:"
"What you did" = "Lo que hiciste"
"Where it went wrong" = "Dónde salió mal"
"How to fix it" = "Cómo corregirlo"
"How it looks done right" = "Cómo se ve bien hecho"
"Your whole flick, from the moment the target could be aimed at to the shot." = "Tu flick completo, desde que se podía apuntar al objetivo hasta el disparo."
"Only the wrong part, in slow motion. Watch for the red marker." = "Solo la parte errónea, en cámara lenta. Fíjate en el marcador rojo."
"What to change on this exact flick." = "Qué cambiar en este flick exacto."
"A realistic corrected flick (green ghost) over yours (grey). Not perfect, just right." = "Un flick corregido realista (fantasma verde) sobre el tuyo (gris). No perfecto, solo correcto."
"Green: corrected example. Grey: your flick." = "Verde: ejemplo corregido. Gris: tu flick."
"Crosshair offset from the target center, in degrees. Yellow circle: the target. Red ring: where it went wrong. Hollow dot: start." = "Desvío del crosshair respecto al centro del objetivo, en grados. Círculo amarillo: el objetivo. Anillo rojo: dónde salió mal. Punto hueco: inicio."
"you passed the target here" = "aquí te pasaste del objetivo"
"your flick stopped short here" = "aquí tu flick se quedó corto"
"your first movement ended here" = "aquí terminó tu primer movimiento"
"you only started moving here" = "recién aquí empezaste a moverte"
"you were on the target here, but did not click" = "aquí estabas sobre el objetivo, pero no hiciste clic"
"Mistake {} of {}" = "Error {} de {}"
"Step {number} of 4: {title}" = "Paso {number} de 4: {title}"

# Score proofs
"Could not build a proof code: {}" = "No se pudo generar un código de prueba: {}"
"Verified: {scenario} score {score}, accuracy {accuracy}%" = "Verificado: {scenario}, puntuación {score}, precisión {accuracy}%"
"Not verified: {}" = "No verificado: {}"
"Not verified: the verifier stopped" = "No verificado: el verificador se detuvo"
"Verify a proof" = "Verificar una prueba"
"Paste a friend's proof code: the run is replayed against your own scenarios, so an edited scenario or a changed score is caught. It shows the inputs give that score, not who played them." = "Pega el código de prueba de un amigo: la partida se vuelve a simular con tus propios escenarios, así que se detecta un escenario editado o una puntuación cambiada. Demuestra que esas entradas dan esa puntuación, no quién las jugó."
"proof code" = "código de prueba"
"Verify" = "Verificar"
