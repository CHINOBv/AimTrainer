# Spanish UI text for the "replays" area. Keys are the exact English source text.
# See docs/i18n.md before editing.

# Replay viewer
"unknown date" = "fecha desconocida"
"{} shot(s), {} missed, killed" = "{} disparo(s), {} fallado(s), eliminado"
"{} shot(s), {} missed, not killed" = "{} disparo(s), {} fallado(s), no eliminado"
"target radius {}°" = "radio del objetivo {}°"
"reaction {} ms" = "reacción {} ms"
"{} correction(s)" = "{} corrección(es)"
"overshot" = "overflick"
"undershot" = "underflick"
"Crosshair offset from the target center, in degrees. Yellow circle: the target. Trail colour: crosshair speed (see the legend). Hollow dot: start. Green dot: hit. Red cross: miss." = "Desvío del crosshair respecto al centro del objetivo, en grados. Círculo amarillo: el objetivo. Color del rastro: velocidad del crosshair (ver la leyenda). Punto hueco: inicio. Punto verde: acierto. Cruz roja: fallo."
"Trail speed:" = "Velocidad del rastro:"
"slow (< {}°/s)" = "lenta (< {}°/s)"
"medium" = "media"
"fast (≥ {}°/s)" = "rápida (≥ {}°/s)"
"Where your shots landed, in target radii (1r is the target's edge), so targets of every size share one grid. Yellow circle: the target. Brighter cells: more shots." = "Dónde cayeron tus disparos, en radios del objetivo (1r es el borde del objetivo), para que objetivos de cualquier tamaño compartan una cuadrícula. Círculo amarillo: el objetivo. Celdas más brillantes: más disparos."
"No shots in this run (hold scenarios record none)." = "No hay disparos en esta partida (los escenarios de mantener no registran ninguno)."
"{hits} hit(s), {misses} miss(es); {outside} outside ±{extent} radii, not drawn" = "{hits} acierto(s), {misses} fallo(s); {outside} fuera de ±{extent} radios, no dibujados"
"Shots per cell:" = "Disparos por celda:"
"No engagements in this run." = "No hay enfrentamientos en esta partida."
"of {} engagements" = "de {} enfrentamientos"
"Zoom on target" = "Zoom al objetivo"
"This run" = "Esta partida"
"Earlier run, engagement {}" = "Partida anterior, enfrentamiento {}"
"The earlier run has only {} engagement(s)." = "La partida anterior solo tiene {} enfrentamiento(s)."
"Shots:" = "Disparos:"
"All" = "Todos"
"Hits" = "Aciertos"
"Misses" = "Fallos"
"Earlier run" = "Partida anterior"
"No replays yet. Every finished run is saved here." = "Aún no hay repeticiones. Cada partida terminada se guarda aquí."
"The selected replay is no longer on disk. Pick another one from the list." = "La repetición seleccionada ya no está en el disco. Elige otra de la lista."
"This replay could not be read." = "No se pudo leer esta repetición."
"View:" = "Vista:"
"Crosshair path" = "Trayectoria del crosshair"
"Shot heatmap" = "Mapa de calor de disparos"

