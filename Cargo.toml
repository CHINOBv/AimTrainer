[workspace]
resolver = "3"
members = ["crates/aim_core", "crates/aim_app", "crates/aim_world", "crates/aim_integrations"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.97.1"

[workspace.dependencies]
aim_core = { path = "crates/aim_core" }
aim_world = { path = "crates/aim_world" }
aim_integrations = { path = "crates/aim_integrations" }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
serde_json = "1.0"
bevy = { version = "0.20", default-features = false, features = ["3d"] }
bevy_egui = "0.43"
directories = "6.0"
global-hotkey = "0.9"

# Part of the coding standard (docs/coding-standards.md): enforced in every crate.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Bevy compiles slowly in debug; optimize dependencies but keep our code fast to rebuild.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
