id = "skill-tracking-reactive"
name = "Tracking II: Reactive"
description = """
Reactive tracking day: sudden direction changes and close strafes.
VDIM-style day (structure from VDIM by Lowgravity56, 4rK and Voltaic): each block runs a related drill,
two harder variants of a benchmark scenario, then the benchmark itself 4 times, played in order.
Levels are relative to your tier; split the day into 2–3 sessions if it gets long."""

