# Original geometry: a 30 x 36 m block of three parallel lanes (west, mid, east) split by
# two long walls with a connector gap in the middle, and an open plaza at each end. Every
# lane has cover every few meters: stacked crates, single crates and wall stubs. The layout
# is the same when turned 180 degrees, so both ends play alike. Not modeled on any game map.
# Coordinates in meters, +Y up, -Z forward.
id = "freight-lanes"
name = "Freight Lanes"
description = "Three parallel lanes between two plazas, joined by a gap in the middle of each lane wall. Crates and wall stubs every few meters. For mid-range deathmatch with rotations."
floor_x = [-15.0, 15.0]
floor_z = [-18.0, 18.0]

# Lane walls at x = -5 and x = 5, z in [-12, 12], with a 4 m connector gap at z in [-2, 2].
[[boxes]]
kind = "wall"
min = [-5.2, 0.0, -12.0]
max = [-4.8, 3.5, -2.0]

[[boxes]]
kind = "wall"
min = [-5.2, 0.0, 2.0]
max = [-4.8, 3.5, 12.0]

[[boxes]]
kind = "wall"
min = [4.8, 0.0, -12.0]
max = [5.2, 3.5, -2.0]

[[boxes]]
kind = "wall"
min = [4.8, 0.0, 2.0]
max = [5.2, 3.5, 12.0]

