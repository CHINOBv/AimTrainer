# Original geometry: a 40 x 40 m yard with layered cover, for deathmatch. Every route
# between the spawns, the pillars and the center passes cover within a few meters: stacked
# crates (hide a standing player), single crates (head stays visible) and wall stubs.
# Not modeled on any game map. Coordinates in meters, +Y up, -Z forward.
id = "training-yard"
name = "Training Yard"
description = "40 x 40 m yard with a Z-shaped center, four pillars with crates, stacked crates beside every spawn, wall stubs at the edges and single crates on the lanes. For deathmatch against bots."
floor_x = [-20.0, 20.0]
floor_z = [-20.0, 20.0]

# Center wall, 4 m long, with a stacked-crate block on opposite sides of each end (a Z
# shape), so the middle has corners to peek from instead of a flat face.
[[boxes]]
kind = "wall"
min = [-2.0, 0.0, -0.3]
max = [2.0, 3.0, 0.3]

[[boxes]]
kind = "cover"
min = [-3.2, 0.0, -1.5]
max = [-2.0, 2.2, -0.3]

[[boxes]]
kind = "cover"
min = [2.0, 0.0, 0.3]
max = [3.2, 2.2, 1.5]

# Side walls, 4 m long, each with a single crate in front toward the center.
[[boxes]]
kind = "wall"
min = [-15.0, 0.0, -2.0]
max = [-14.6, 3.0, 2.0]

[[boxes]]
kind = "wall"
min = [14.6, 0.0, -2.0]
max = [15.0, 3.0, 2.0]

[[boxes]]
kind = "low_cover"
min = [-9.5, 0.0, -0.5]
max = [-8.5, 1.0, 0.5]

[[boxes]]
kind = "low_cover"
min = [8.5, 0.0, -0.5]
max = [9.5, 1.0, 0.5]

# Wall stubs off the east and west edges, 2.5 m long: a corner to hold near each corner
# spawn instead of an empty strip along the edge.
[[boxes]]
kind = "wall"
min = [-20.0, 0.0, -10.2]
max = [-17.5, 3.0, -9.8]

[[boxes]]
kind = "wall"
min = [17.5, 0.0, -10.2]
max = [20.0, 3.0, -9.8]

[[boxes]]
kind = "wall"
min = [-20.0, 0.0, 9.8]
max = [-17.5, 3.0, 10.2]

[[boxes]]
kind = "wall"
min = [17.5, 0.0, 9.8]
max = [20.0, 3.0, 10.2]

# Pillars, 1.2 m square and 2.5 m tall: hide a standing player. Each has a single crate on
# its outer side, so a player can hold over the crate (head only) or behind the pillar.
[[boxes]]
kind = "cover"
min = [-10.0, 0.0, -10.0]
max = [-8.8, 2.5, -8.8]

[[boxes]]
kind = "low_cover"
min = [-11.0, 0.0, -10.0]
max = [-10.0, 1.0, -9.0]

[[boxes]]
kind = "cover"
min = [8.8, 0.0, -10.0]
max = [10.0, 2.5, -8.8]

[[boxes]]
kind = "low_cover"
min = [10.0, 0.0, -10.0]
max = [11.0, 1.0, -9.0]

[[boxes]]
kind = "cover"
min = [8.8, 0.0, 8.8]
max = [10.0, 2.5, 10.0]

[[boxes]]
kind = "low_cover"
min = [10.0, 0.0, 9.0]
max = [11.0, 1.0, 10.0]

[[boxes]]
kind = "cover"
min = [-10.0, 0.0, 8.8]
max = [-8.8, 2.5, 10.0]

[[boxes]]
kind = "low_cover"
min = [-11.0, 0.0, 9.0]
max = [-10.0, 1.0, 10.0]

