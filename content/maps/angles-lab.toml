# Original geometry: a start room, a 1.8 m doorway, a 6 m wide corridor with a wall stub,
# and a long hall with a tall box and a far block. Each drill angle has a marker.
# Not modeled on any game map. Coordinates in meters, +Y up, -Z forward.
id = "angles-lab"
name = "Angles Lab"
description = "A path from a start room through a doorway and corridor into a long hall. Five marked angles: doorway, close corner, off-angle, box and a 37 m long angle."
floor_x = [-10.0, 10.0]
floor_z = [-62.0, 4.0]

# Start-room wall with a 1.8 m doorway at x in [-0.9, 0.9].
[[boxes]]
kind = "wall"
min = [-10.0, 0.0, -6.4]
max = [-0.9, 3.5, -6.0]

[[boxes]]
kind = "wall"
min = [0.9, 0.0, -6.4]
max = [10.0, 3.5, -6.0]

# Corridor walls, 6 m apart, z in [-24.4, -6.4].
[[boxes]]
kind = "wall"
min = [-3.4, 0.0, -24.4]
max = [-3.0, 3.5, -6.4]

[[boxes]]
kind = "wall"
min = [3.0, 0.0, -24.4]
max = [3.4, 3.5, -6.4]

# Wall stub on the right side of the corridor that hides the off-angle.
[[boxes]]
