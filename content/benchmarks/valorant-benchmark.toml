id = "valorant-benchmark"
name = "VALORANT Benchmark"
description = """
Measures every aim skill VALORANT asks of you. It uses Voltaic's structure: skill → subcategory → scenarios.
Your best scenario sets each subcategory's energy, and the overall energy is the harmonic mean, so your weakest skill counts most.
PROVISIONAL: thresholds come from the simulated aimer profiles (Fitts' law model), not from real players.
Run it once a week, not daily.
Three tiers play the same scenarios at different difficulty levels (novice −0.5, intermediate as authored, advanced +0.5), each with its own thresholds; pick the tier that matches your training tier."""
calibrated = false
ranks = ["Recruit", "Contender", "Veteran", "Elite"]
energy_per_rank = 100

# Same scenario families at three difficulty levels. Intermediate (level 0) uses `thresholds`;
# the other tiers use `tiers.<id>`. Provisional: simulated profiles at each level, see
# docs/training-science.md.
[[tiers]]
id = "novice"
name = "Novice"
level = -0.5

[[tiers]]
id = "intermediate"
name = "Intermediate"
level = 0.0

[[tiers]]
id = "advanced"
name = "Advanced"
level = 0.5

[[subcategories]]
skill = "clicking"
name = "Static clicking"
scenarios = [
  { id = "micro-adjust", thresholds = [3300, 6000, 9400, 12600], tiers = { novice = [3400, 6200, 9950, 13300], advanced = [3150, 5800, 8950, 11950] } },
  { id = "static-headline", thresholds = [2600, 4700, 7050, 9500], tiers = { novice = [2650, 4800, 7250, 9750], advanced = [2550, 4550, 6850, 9200] } },
]

