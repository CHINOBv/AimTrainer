# Idea credit: vertical precise-tracking drills (Voltaic weakness routines). Original scenario.
id = "vertical-rail"
name = "Vertical Rail"
category = "tracking"
description = """
Precise vertical tracking. A sphere rides up and down a rail, resting briefly at each end, and changes pace every few seconds.
Most tracking is sideways: this one trains smooth vertical mouse control."""
duration_secs = 45

[weapon]
fire = "hold"

[targets]
shape = { kind = "sphere", radius = 0.18 }
spawn = { kind = "floor", x = [-2.0, 2.0], z = [-12.0, -10.0], height = [0.6, 0.6] }
health = inf

[[targets.motion_profiles]]
switch_secs = [3.0, 5.0]
motion = { kind = "path", points = [[0.0, 2.0, 0.0]], speed = [1.05, 1.35], pause_secs = [0.0, 0.15], route = "ping_pong" }

[[targets.motion_profiles]]
switch_secs = [3.0, 5.0]
motion = { kind = "path", points = [[0.0, 2.0, 0.0]], speed = [1.45, 1.75], pause_secs = [0.0, 0.15], route = "ping_pong" }

[[targets.motion_profiles]]
switch_secs = [3.0, 5.0]
motion = { kind = "path", points = [[0.0, 2.0, 0.0]], speed = [1.8, 2.2], pause_secs = [0.0, 0.15], route = "ping_pong" }

[scoring]
sphere = 100   # points per second on target
