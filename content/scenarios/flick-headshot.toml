id = "flick-headshot"
name = "Headshot Flicks"
category = "flicking"
game = "valorant"
description = """
VALORANT-sized agents appear 10–47° to either side at 10–30 m, always inside VALORANT's
view. Only headshots count. Trains flicking straight to head level, as in an entry or
retake duel."""

[weapon]
kind = "vandal"

[targets]
shape = { kind = "humanoid", head_only = true }
spawn = { kind = "around_crosshair", offset_deg = [10.0, 47.0], distance = [10.0, 30.0], on_screen = true }

[scoring]
miss_penalty = 25
