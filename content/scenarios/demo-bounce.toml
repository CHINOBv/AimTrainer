id = "demo-bounce"
name = "Demo: Polygon Bounce"
category = "tracking"
description = """
Engine demo for the linear_bounce motion. A sphere glides in straight lines at a constant
speed and reflects off the walls of a pentagon in front of you. Keep the crosshair on it."""
duration_secs = 45

[weapon]
fire = "hold"

[targets]
shape = { kind = "sphere", radius = 0.3 }
spawn = { kind = "angular", yaw_deg = [-5.0, 5.0], pitch_deg = [6.0, 10.0], distance = [12.0, 12.0] }
motion = { kind = "linear_bounce", speed_deg = [10.5, 13.5], arena = { yaw_deg = [-20.0, 20.0], pitch_deg = [0.0, 18.0], sides = 5 } }
health = inf
