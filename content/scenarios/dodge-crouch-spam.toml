id = "dodge-crouch-spam"
name = "Crouch Spam"
category = "precision"
description = """
Clicking against crouch spam. One agent strafes, stops and often crouches mid-duel, dropping its head ≈0.5 m in 0.15 s.
Watch the head, not the body: when it ducks, bring the crosshair down with it and tap; when it stands, come back up.
It leaves after 3 s."""

[targets]
shape = { kind = "humanoid", head_only = true }
spawn = { kind = "floor", x = [-7.0, 7.0], z = [-18.0, -10.0] }
motion = { kind = "dodge", weapon = "vandal", change_secs = [0.35, 0.8], juke_chance = 0.2, stop_chance = 0.15, crouch_chance = 0.4, max_offset = 2.0 }
max_alive = 1
lifetime_secs = 3.0

[scoring]
miss_penalty = 20
expire_penalty = 50
