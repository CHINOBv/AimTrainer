id = "spread-flicks"
name = "Spread Flicks"
category = "flicking"
description = """
One target at a time anywhere in an 80° arc, but never near the last two spawns, never
within 12° of your crosshair and never in the middle of the arc. Every kill forces a real
flick in a new direction, so you cannot settle into one comfortable motion."""

[targets]
shape = { kind = "sphere", radius = 0.22 }
spawn = { kind = "angular", yaw_deg = [-40.0, 40.0], pitch_deg = [-6.0, 16.0], distance = [12.0, 12.0] }
spawn_rules = { avoid_last_deg = 15, avoid_recent = 2, min_flick_deg = 12, exclude_center = 0.25 }

[scoring]
miss_penalty = 20
