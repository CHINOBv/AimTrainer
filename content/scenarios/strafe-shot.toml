id = "strafe-shot"
name = "Strafe Shot"
category = "movement"
game = "valorant"
description = """
Keep moving between shots. Four targets sit at different heights. Strafe, stop, shoot one, and strafe again.
Moving shots are inaccurate and penalised, so this drills the move, stop, shoot rhythm."""

[weapon]
kind = "phantom"
simulate_spread = true

[player]
movement = true
bounds_x = [-16.0, 16.0]
bounds_z = [-4.0, 8.0]

[targets]
shape = { kind = "sphere", radius = 0.2 }
spawn = { kind = "floor", x = [-10.0, 10.0], z = [-20.0, -12.0], height = [0.8, 2.6] }
max_alive = 4
min_separation_deg = 8

[scoring]
miss_penalty = 10
moving_shot_penalty = 40
