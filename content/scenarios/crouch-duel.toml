# Original drill from the movement research (docs/library.md, "Library: movement").
# Idea: Duel against crouch spam while moving.
id = "crouch-duel"
name = "Crouch Duel"
category = "movement"
game = "valorant"
description = """
Duel agents that crouch-spam and strafe while you move. Each crouch drops the head by about half a meter.
Stop, hold the head line, and tap when the head settles instead of chasing every drop. Moving shots lose points."""

[weapon]
kind = "vandal"
simulate_spread = true

[player]
movement = true
bounds_x = [-16.0, 16.0]
bounds_z = [-2.0, 6.0]

[targets]
shape = { kind = "humanoid", head_only = true }
spawn = { kind = "floor", x = [-6.0, 6.0], z = [-16.0, -10.0] }
motion = { kind = "dodge", weapon = "vandal", change_secs = [0.3, 0.7], juke_chance = 0.2, stop_chance = 0.15, crouch_chance = 0.4, max_offset = 2.5 }
max_alive = 1
lifetime_secs = 3.5

[scoring]
miss_penalty = 10
moving_shot_penalty = 50
expire_penalty = 40
stop_window = { secs = 0.3, bonus = 30 }
