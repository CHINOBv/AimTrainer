id = "dodge-juke-heads"
name = "Juke Heads"
category = "flicking"
description = """
Dynamic clicking against jukes. Two agents strafe with VALORANT rifle movement, but half of their moves are quick A-D taps
that reverse almost at once, and some end in a full stop. Do not chase the juke: keep the crosshair on the head line and
tap when they stop or reverse. They leave after 3 s."""

[targets]
shape = { kind = "humanoid", head_only = true }
spawn = { kind = "floor", x = [-8.0, 8.0], z = [-22.0, -12.0] }
motion = { kind = "dodge", weapon = "vandal", change_secs = [0.3, 0.7], juke_secs = [0.1, 0.22], juke_chance = 0.5, stop_chance = 0.25, max_offset = 2.5 }
max_alive = 2
lifetime_secs = 3.0
min_separation_deg = 6

[scoring]
miss_penalty = 20
expire_penalty = 50
