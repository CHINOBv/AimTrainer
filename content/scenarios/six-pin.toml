# Idea: Aim Lab "Sixshot" (six static targets, always six on screen). Own name and parameters.
id = "six-pin"
name = "Six Pin"
category = "precision"
description = """
Static clicking. Six small spheres stay on the wall at all times; each kill puts a new one
somewhere else. The final score is multiplied by your accuracy, so a fast miss costs more
than a slow hit. Trains clean, confirmed clicks on stationary targets."""

[targets]
shape = { kind = "sphere", radius = 0.12 }
spawn = { kind = "angular", yaw_deg = [-24.0, 24.0], pitch_deg = [-2.0, 14.0], distance = [12.0, 12.0] }
max_alive = 6
min_separation_deg = 6
spawn_rules = { avoid_last_deg = 4 }

[scoring]
accuracy_mult = "linear"
