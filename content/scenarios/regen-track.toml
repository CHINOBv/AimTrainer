id = "regen-track"
name = "Regen Track"
category = "tracking"
description = """
Track a strafing sphere until it dies. It heals whenever your crosshair leaves it for 0.3 s,
and its points per second fade the longer it lives, so only steady, unbroken tracking kills
it quickly and keeps the score high. Hold fire the whole time."""
duration_secs = 60

[weapon]
fire = "hold"

[targets]
shape = { kind = "sphere", radius = 0.35 }
spawn = { kind = "angular", yaw_deg = [-15.0, 15.0], pitch_deg = [0.0, 8.0], distance = [10.0, 10.0] }
motion = { kind = "strafe", weapon = "vandal", change_secs = [0.3, 0.8], stop_chance = 0.1, max_offset = 3.0 }
health = 1.5
regen = { interval_secs = 0.3, amount = 0.2, reset_on_hit = true }

[scoring]
sphere = 100   # points per second on target
decay = { window_secs = 3.0, floor = 0.4 }
