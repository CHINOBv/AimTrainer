id = "flick-wide"
name = "Wide Flicks"
category = "flicking"
description = """
Static clicking with large flicks: one target appears 20–47° away from your crosshair,
always inside VALORANT's view, so you flick to it instead of searching for it.
Trains arm-driven flicks and stopping cleanly on target."""

[targets]
shape = { kind = "sphere", radius = 0.22 }
spawn = { kind = "around_crosshair", offset_deg = [20.0, 47.0], distance = [12.0, 12.0], on_screen = true }

[scoring]
miss_penalty = 20
