# Idea credit: the thin-target smooth tracking drills of the Voltaic precise-tracking slot.
# Original scenario: no file, name or value was copied.
# Approximation: a capsule's drift also wanders vertically; the tall, thin capsule absorbs
# that, so the hard part stays the horizontal glide.
id = "thin-glide"
name = "Thin Glide"
category = "tracking"
description = """
Precise tracking. A thin standing capsule glides on long, smooth paths at changing speeds.
Hold fire and keep the crosshair on its narrow body without overshooting."""
duration_secs = 60

[weapon]
fire = "hold"

[targets]
shape = { kind = "capsule", radius = 0.13, height = 1.7 }
spawn = { kind = "angular", yaw_deg = [-10.0, 10.0], pitch_deg = [0.0, 0.0], distance = [12.0, 12.0] }
motion = { kind = "drift", speed = [0.6, 2.4], change_secs = [1.2, 2.4], max_offset = 5.0 }
health = inf

[scoring]
body = 100   # points per second on target
