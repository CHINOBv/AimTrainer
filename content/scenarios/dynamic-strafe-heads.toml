id = "dynamic-strafe-heads"
name = "Strafing Heads"
category = "flicking"
description = """
Dynamic clicking. Two agents A/D strafe with real VALORANT rifle movement (5.4 m/s, measured stopping curves).
Read their movement and tap the head; they leave after 3 s."""

[targets]
shape = { kind = "humanoid", head_only = true }
spawn = { kind = "floor", x = [-10.0, 10.0], z = [-25.0, -10.0] }
motion = { kind = "strafe", weapon = "vandal", change_secs = [0.25, 0.9], stop_chance = 0.2, max_offset = 3.0 }
max_alive = 2
lifetime_secs = 3.0
min_separation_deg = 6

[scoring]
miss_penalty = 20
expire_penalty = 50
